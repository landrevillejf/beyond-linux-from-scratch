# GRUB configuration template for Beyond Linux From Scratch
# This file is used by final/13-create-bootloader.sh
# Variables are substituted at build time by the builder.

set default=0
set timeout=${LFS_CONFIG_BOOTLOADER_TIMEOUT:-5}

# Branding colors (Forest Green theme)
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green

# Background image (if available)
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    if [ -f /usr/share/backgrounds/lfs/lfs-wallpaper.png ]; then
        insmod png
        background_image /usr/share/backgrounds/lfs/lfs-wallpaper.png
    fi
fi

# Terminal setup
insmod all_video
insmod gfxterm
terminal_output gfxterm

# ---- Default boot entry ----
menuentry 'Beyond Linux From Scratch' --class lfs --class gnu-linux --class gnu --class os {
    load_video
    insmod gzio
    insmod part_msdos
    insmod ext2

    set root='${LFS_ROOT_DEVICE}'
    search --no-floppy --fs-uuid --set=root '${LFS_ROOT_UUID}'

    linux   /boot/vmlinuz-${LFS_KERNEL_VERSION} root=UUID=${LFS_ROOT_UUID} ro ${LFS_KERNEL_CMDLINE:-quiet splash}
    initrd  /boot/initramfs-${LFS_KERNEL_VERSION}.img
}

# ---- Recovery mode ----
menuentry 'Beyond Linux From Scratch (recovery)' --class lfs --class gnu-linux --class gnu --class os {
    load_video
    insmod gzio
    insmod part_msdos
    insmod ext2

    set root='${LFS_ROOT_DEVICE}'
    search --no-floppy --fs-uuid --set=root '${LFS_ROOT_UUID}'

    linux   /boot/vmlinuz-${LFS_KERNEL_VERSION} root=UUID=${LFS_ROOT_UUID} ro single ${LFS_KERNEL_CMDLINE:-quiet}
    initrd  /boot/initramfs-${LFS_KERNEL_VERSION}.img
}

# ---- Live system (if applicable) ----
if [ -f /boot/live/vmlinuz ]; then
    menuentry 'Boot Live System' --class lfs --class gnu-linux --class gnu --class os {
        load_video
        insmod gzio
        insmod part_msdos
        insmod squash4
        insmod loopback

        linux   /boot/live/vmlinuz boot=live quiet splash
        initrd  /boot/live/initrd.img
    }
fi
