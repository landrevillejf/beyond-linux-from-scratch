# ============================================================================
# LPM (LFS Package Manager) CONFIGURATION
# ============================================================================
# This file is sourced by /usr/bin/lpm at startup. Only the variables
# below are consumed by the current engine; anything else is ignored,
# so keep this list in sync with blfs/19-lpm.sh.
#
# NOTE: LPM_DB is a DIRECTORY, not a file. The databases live inside
# it (packages.list, installed.list, file_index, ...).

# Runtime paths
LPM_DB=/var/lib/lpm
LPM_LOGS=/var/log/lpm
LPM_ETC=/etc/lpm
LPM_PACKAGES_DIR=/usr/share/lpm/packages
LPM_BUILD_DIR=/var/lib/lpm/build

# Remote repositories are declared in /etc/lpm/repos.d/*.conf
# (name=url lines, first match wins). Keep this array empty here.
REPO_REMOTE_URLS=()

# Integrity and authenticity
VERIFY_CHECKSUMS=true
# Flip to true once the release GPG key is published and imported
# into the keyring below.
VERIFY_SIGNATURES=false
GPG_KEYRING=/etc/lpm/trusted.gpg

# Source builds
BUILD_JOBS=$(nproc)
KEEP_BUILD_ARTIFACTS=false

# Log retention (days)
LOG_RETENTION_DAYS=30

# Terminal colors (true/false; the NO_COLOR env var is also honoured)
USE_COLOR=true
