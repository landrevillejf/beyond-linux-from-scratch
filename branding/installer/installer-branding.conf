# Installer branding configuration for GRUB and boot environment
# This configuration is used during system installation

# Color scheme for GRUB menu (Forest Green theme)
GRUB_COLOR_NORMAL="lightgray/black"
GRUB_COLOR_HIGHLIGHT="black/lightgreen"

# Primary colors (hex values for custom graphics)
PRIMARY_COLOR="#2E8B57"
PRIMARY_DARK="#236B43"
PRIMARY_LIGHT="#3CB371"
SECONDARY_COLOR="#1a1a2e"
ACCENT_COLOR="#90EE90"
TEXT_PRIMARY="#f0f0f0"
BACKGROUND="#0d0d14"

# Fonts
FONT_FAMILY="Inter,Helvetica,Arial,sans-serif"
FONT_MONO="JetBrains Mono,Courier New,monospace"

# ISO volume label
ISO_LABEL="BLFS-0.4.5-LIVE"
ISO_PUBLISHER="Beyond Linux From Scratch"
ISO_DESCRIPTION="Professional Linux Distribution Built From Source"

# GRUB configuration
GRUB_TIMEOUT=10
GRUB_DEFAULT=0

# Boot splash settings
ENABLE_BOOT_SPLASH=true
SPLASH_THEME="lfs-installer-dark"

# Installer UI branding
INSTALLER_TITLE="Beyond Linux From Scratch Installer"
INSTALLER_VERSION="0.4.5"
INSTALLER_SUBTITLE="Build Your Own Professional Linux Distribution"

# Asset paths (relative to this file's directory)
LOGO_PATH="logo"
BACKGROUND_PATH="backgrounds"
FONTS_PATH="fonts"
GRUB_BG_PATH="backgrounds/grub-background.png"

# Branding flags
USE_BRANDED_GRUB=true
USE_BRANDED_SPLASH=true
USE_CUSTOM_BOOT_MESSAGES=true
