<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
    <defs>
        <!-- Ombre portée pour les textes -->
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
        </filter>
        <!-- Dégradé pour le badge -->
        <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2E8B57" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#1a5e3a" stop-opacity="0.95"/>
        </linearGradient>
        <!-- Lueur externe pour le badge -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Badge arrondi avec dégradé et transparence -->
    <rect x="20" y="20" width="360" height="160" rx="30" fill="url(#badgeGrad)" filter="url(#glow)"/>

    <!-- "LFS" en grand, blanc, avec ombre -->
    <text x="200" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8" filter="url(#shadow)">LFS</text>

    <!-- "Linux From Scratch" en plus petit, vert clair, avec ombre -->
    <text x="200" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="300" fill="#90EE90" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">Linux From Scratch</text>

    <!-- Fine ligne décorative sous "LFS" -->
    <line x1="100" y1="125" x2="300" y2="125" stroke="#90EE90" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4,4"/>
</svg>