name: Cache LFS/BLFS Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'  # First day of month at 2 AM UTC

permissions:
  contents: write

jobs:
  download-packages:
    name: Download and Cache Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create sources directory
        run: |
          mkdir -p /tmp/lfs-sources
          chmod 777 /tmp/lfs-sources

      - name: Download LFS/BLFS packages
        run: |
          cd ${{ github.workspace }}
          python3 << 'PYTHON_SCRIPT'
          import sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from builder import SourceDownloader
          import logging
          
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("PackageCache")
          
          sources_dir = Path("/tmp/lfs-sources")
          sources_dir.mkdir(parents=True, exist_ok=True)
          
          downloader = SourceDownloader(
              sources_dir=sources_dir,
              logger=logger,
              timeout=120,
              retries=5
          )
          
          # Download from main sources list (3 parallel to avoid rate-limiting)
          sources_list = Path("packages/sources.list")
          if sources_list.exists():
              logger.info(f"Downloading from {sources_list}")
              downloader.download_from_list(sources_list, parallel=3, retry_passes=3)
          
          # Download from custom sources
          custom_sources = Path("packages/custom-sources.list")
          if custom_sources.exists():
              logger.info(f"Downloading from {custom_sources}")
              downloader.download_from_list(custom_sources, parallel=3, retry_passes=3)
          
          PYTHON_SCRIPT

      - name: Check downloaded packages
        run: |
          ls -lh /tmp/lfs-sources/ | head -20
          du -sh /tmp/lfs-sources/
          echo "Total files: $(find /tmp/lfs-sources -type f | wc -l)"

      - name: Create checksums
        run: |
          cd /tmp/lfs-sources
          sha256sum * > SHA256SUMS 2>/dev/null || true
          wc -l SHA256SUMS

      - name: Split packages into artifacts (max 2GB per part for GitHub Release limit)
        run: |
          mkdir -p /tmp/artifacts
          
          # Stream tar output and split into 1900MB parts (safely under GitHub's 2GB release asset limit)
          tar --exclude='SHA256SUMS' -czf - -C /tmp lfs-sources/ | \
            split -b 1900m -d -a 2 - /tmp/artifacts/lfs-packages-part-
          
          # Add .tar.gz extension to each numbered part
          for f in /tmp/artifacts/lfs-packages-part-[0-9][0-9]; do
            mv "$f" "${f}.tar.gz"
          done
          
          echo "Archive parts created:"
          ls -lh /tmp/artifacts/lfs-packages-part-*.tar.gz
          echo "Part count: $(ls /tmp/artifacts/lfs-packages-part-*.tar.gz | wc -l)"

      - name: Generate release body
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            echo '# 📦 LFS/BLFS Packages Cache'
            echo ''
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Total packages: $(find /tmp/lfs-sources -type f | wc -l)"
            echo "Cache size: $(du -sh /tmp/lfs-sources | cut -f1)"
            echo ''
            echo 'Use these cached packages to speed up builds.'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Upload packages to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/lfs-packages-part-*.tar.gz
            /tmp/lfs-sources/SHA256SUMS
          tag_name: packages-cache-latest
          name: LFS/BLFS Packages Cache
          body: ${{ steps.release_body.outputs.body }}
          prerelease: true
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Drop superseded cache parts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # softprops/action-gh-release only adds or overwrites assets, so a
          # generation that splits into fewer parts than the previous one leaves
          # the older tails attached to the release: the 2026-09-01 run published
          # two parts and the 2026-08-03 part-02..04 (4.8 GB) are still there.
          # Every consumer downloads all assets matching
          # lfs-packages-part-*.tar.gz and cats them into one tar stream, so each
          # job of each build pays for two cache generations and GNU tar's
          # end-of-archive marker is the only thing that keeps the older one from
          # being unpacked on top of the newer.  The tails are deleted after the
          # upload, never before, so a build running while this step is in flight
          # still finds a complete archive set.
          new_parts=$(find /tmp/artifacts -maxdepth 1 -name 'lfs-packages-part-*.tar.gz' | wc -l)
          assets=$(gh release view packages-cache-latest \
                     --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in $assets; do
            case "$asset" in
              lfs-packages-part-*.tar.gz) ;;
              *) continue ;;
            esac
            index=${asset#lfs-packages-part-}
            index=${index%.tar.gz}
            if [ "$((10#$index))" -ge "$new_parts" ]; then
              echo "Removing superseded part: $asset"
              gh release delete-asset packages-cache-latest "$asset" --yes || true
            fi
          done
          echo "Release assets now:"
          gh release view packages-cache-latest --json assets --jq '.assets[].name' || true

      - name: Create cache summary
        if: success()
        run: |
          echo "# 📦 Package Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Cache updated" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Total packages**: $(find /tmp/lfs-sources -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Total size**: $(du -sh /tmp/lfs-sources | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Use `actions/download-artifact@v4` to retrieve in build workflows" >> $GITHUB_STEP_SUMMARY

      - name: Report any failures
        if: failure()
        run: |
          echo "⚠️ Package download partially failed" >> $GITHUB_STEP_SUMMARY
          echo "Review logs for details" >> $GITHUB_STEP_SUMMARY
