name: Cross-Compile ARM64

on:
  schedule:
    - cron: '0 3 * * *'   # 3am daily
  workflow_dispatch:   # <-- permet de lancer manuellement

permissions:
  contents: read

jobs:
  cross:
    # Stays on x86_64 on purpose: this workflow is the cross-compilation
    # proof, which a native ARM runner could not provide.  It no longer
    # tries to yield a bootable aarch64 system, because under qemu-user that
    # cannot finish at any stage timeout - lfs-system measured 4h20m for the
    # 14 packages x86_64 builds in under an hour (~27x slower per package),
    # projecting past 11h against GitHub's hard 6h per-job cap.  Raising the
    # stage timeout to 10800, as this workflow briefly did, only turned a 2h
    # kill into a 3h one.  arm64-xfce.yml now builds the real aarch64 system
    # natively; this job asserts the cross toolchain and stops.
    runs-on: ubuntu-latest
    # Nightly #221 measured 29m from job start to the toolchain stage and
    # 40m for the stage itself.  150 covers that plus a fresh (uncached)
    # source download and slow mirrors, while staying well clear of the 6h
    # cap where the platform kills the job and no diagnostics survive.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex gawk texinfo \
            wget curl git python3 python3-pip xorriso isolinux \
            mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user-static

      - name: Create lfs user
        run: |
          if ! id lfs &>/dev/null; then
            sudo useradd -m -s /bin/bash lfs
          fi
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Grant lfs user passwordless sudo
        run: |
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs

      - name: Prepare lfs build directory
        run: |
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a $GITHUB_WORKSPACE/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Build the ARM64 cross toolchain
        run: |
          cd /tmp/lfs-build
          # --stop-after toolchain is the entire scope of this workflow: it
          # runs host-check, host-prepare, qemu-setup, disk-image and
          # toolchain, then stops.  The stage timeout stays at its 7200s
          # default because the toolchain measured 40m - a longer budget
          # would only delay the report of a genuinely stuck stage.
          #
          # --no-live is redundant next to --stop-after and kept anyway: if
          # the truncation is ever dropped, this job still must not try to
          # build a live ISO for a foreign architecture.
          #
          # Download flags match nightly.yml.
          sudo -u lfs python3 builder.py --profile arm64 --no-live \
            --output ./build-arm64 \
            --stop-after toolchain \
            --download-timeout 600 \
            --download-retries 5

      - name: Verify the cross toolchain
        run: |
          # A --stop-after toolchain run produces no image, so the image
          # check this step replaced could only ever exit 1.  What follows
          # asserts what the stage actually promises, using the same
          # predicate host/04-build-toolchain.sh's own check_toolchain()
          # uses to decide the toolchain is already built (same three
          # binaries, same compile probe), so this job fails on exactly the
          # condition the build itself treats as "not there".
          TOOLS=/tmp/lfs-build/build-arm64/tools/bin
          TGT=aarch64-lfs-linux-gnu
          for tool in gcc ld as; do
            if [ ! -x "$TOOLS/$TGT-$tool" ]; then
              echo "missing $TGT-$tool"
              exit 1
            fi
            "$TOOLS/$TGT-$tool" --version
          done

          echo 'int main(void){return 0;}' > /tmp/probe.c
          "$TOOLS/$TGT-gcc" /tmp/probe.c -o /tmp/probe

          # The whole point of a cross toolchain: the output must be
          # AArch64, not the x86_64 this runner is executing on.
          readelf -h /tmp/probe | grep 'Machine:.*AArch64'

          # Best effort on purpose.  Executing the probe needs the sysroot's
          # ELF interpreter resolved through QEMU_LD_PREFIX, which depends
          # on how far the glibc install got; a warning here must not mask a
          # toolchain that built and links correctly.
          if QEMU_LD_PREFIX=/tmp/lfs-build/build-arm64 \
            qemu-aarch64-static /tmp/probe; then
            echo "probe executed under qemu-aarch64-static"
          else
            echo "::warning::probe did not execute under qemu-aarch64-static"
          fi

      - name: Upload cross toolchain logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-toolchain-logs
          # Scoped to what builder.py writes as the lfs user.  The root-owned
          # tree under image/ is deliberately excluded: build-base-cache #7
          # failed on exactly that, walking directories the chroot created
          # mode 700 as an unprivileged user.
          path: |
            /tmp/lfs-build/build-arm64/logs/
            /tmp/lfs-build/build-arm64/build_info.json
          if-no-files-found: warn