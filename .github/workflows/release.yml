# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check LFS compatibility of shell scripts
        run: |
          python3 lfs_check.py --shellcheck

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev squashfs-tools ca-certificates \
            libgmp-dev libmpfr-dev libmpc-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Generate sources.list
        run: python3 builder.py --generate-sources-list

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Prepare lfs build directory
        run: |
          sudo rm -rf /tmp/lfs-build
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: /tmp/lfs-build/build-release/sources
          key: lfs-sources-release-${{ hashFiles('packages/sources.list') }}
          restore-keys: |
            lfs-sources-release-
            lfs-sources-

      - name: Verify sources
        run: python3 lfs_verify_sources.py --sources-dir ./build-release/sources
        working-directory: /tmp/lfs-build

      - name: Run tests
        run: python3 -m pytest tests/ -q
        working-directory: /tmp/lfs-build

      - name: Build release profile (xfce + sysvinit live)
        run: |
          cd /tmp/lfs-build
          sudo -u lfs python3 builder.py --profile xfce --init sysvinit --output ./build-release --verbose
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Verify kernel and ISO
        run: |
          ls /tmp/lfs-build/build-release/image/boot/vmlinuz*
          test -s /tmp/lfs-build/build-release/lfs-installer.iso
          sha256sum /tmp/lfs-build/build-release/lfs-installer.iso > /tmp/lfs-build/build-release/SHA256SUMS
          sha256sum /tmp/lfs-build/build-release/image/boot/vmlinuz* >> /tmp/lfs-build/build-release/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            /tmp/lfs-build/build-release/lfs-installer.iso
            /tmp/lfs-build/build-release/image/boot/vmlinuz*
            /tmp/lfs-build/build-release/SHA256SUMS
            /tmp/lfs-build/build-release/build_info.json
          if-no-files-found: error

      - name: Boot ISO in QEMU (smoke test)
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          ISO_PATH="/tmp/lfs-build/build-release/lfs-installer.iso"
          echo "Booting $ISO_PATH in QEMU..."
          timeout 90s qemu-system-x86_64 \
            -cdrom "$ISO_PATH" \
            -nographic -no-reboot -m 2G -smp 2 \
            -append "console=ttyS0" | tee qemu.log || true
          if grep -qi "LFS\|init:\|login:" qemu.log; then
            echo "ISO booted successfully!"
          else
            echo "ISO boot failed – no expected output found"
            cat qemu.log
            exit 1
          fi

      # NEW: Audit system after build (mount /dev and run audit)
      - name: Audit system (after build)
        if: success()
        run: |
          sudo mount --bind /dev /tmp/lfs-build/build-release/dev
          python3 lfs_audit_system.py /tmp/lfs-build/build-release
        working-directory: /tmp/lfs-build
        continue-on-error: true   # optional – prevents release failure if audit fails

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/lfs-build/build-release/lfs-installer.iso
            /tmp/lfs-build/build-release/image/boot/vmlinuz*
            /tmp/lfs-build/build-release/build_info.json
            /tmp/lfs-build/build-release/SHA256SUMS
          generate_release_notes: true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: /tmp/lfs-build/build-release/logs/