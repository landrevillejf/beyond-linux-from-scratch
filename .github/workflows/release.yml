# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev squashfs-tools ca-certificates

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Generate sources.list
        run: python3 builder.py --generate-sources-list

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: ./build-release/sources
          key: lfs-sources-release-${{ hashFiles('packages/sources.list') }}
          restore-keys: |
            lfs-sources-release-
            lfs-sources-

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Build release profile (xfce + sysvinit live)
        run: |
          sudo -u lfs python3 builder.py --profile xfce --init sysvinit --output ./build-release --verbose
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Verify kernel and ISO
        run: |
          ls ./build-release/image/boot/vmlinuz*
          test -s ./build-release/lfs-installer.iso
          sha256sum ./build-release/lfs-installer.iso > ./build-release/SHA256SUMS
          sha256sum ./build-release/image/boot/vmlinuz* >> ./build-release/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            ./build-release/lfs-installer.iso
            ./build-release/image/boot/vmlinuz*
            ./build-release/SHA256SUMS
            ./build-release/build_info.json
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build-release/lfs-installer.iso
            ./build-release/image/boot/vmlinuz*
            ./build-release/build_info.json
            ./build-release/SHA256SUMS
          generate_release_notes: true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: ./build-release/logs/
