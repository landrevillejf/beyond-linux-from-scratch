# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  restore-cache:
    name: Restore Package Cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Relocate build scratch off /tmp tmpfs
        # ubuntu-latest moved to an Ubuntu 26 runner image whose /tmp is a
        # ~7.9G RAM-backed tmpfs; the restored package cache is multiple GB
        # under /tmp/lfs-sources, which made this job die with ENOSPC. Bind
        # the scratch dirs onto the 145G root disk so every /tmp/lfs-* path
        # below works unchanged. Warn (never fail) if a runner cannot bind.
        run: |
          sudo mkdir -p /mnt/lfs-scratch
          for d in lfs-build lfs-sources base-cache; do
            sudo mkdir -p "/mnt/lfs-scratch/$d" "/tmp/$d"
            sudo mount --bind "/mnt/lfs-scratch/$d" "/tmp/$d" \
              || echo "::warning::could not bind /tmp/$d onto the root disk"
          done
          df -h /tmp /mnt/lfs-scratch

      - name: Download cached packages from release
        run: |
          mkdir -p /tmp/artifacts
          cd /tmp/artifacts
          
          # Try to download all split parts of the packages cache release
          gh release download packages-cache-latest \
            --repo ${{ github.repository }} \
            --pattern "lfs-packages-part-*.tar.gz" \
            --pattern "SHA256SUMS" \
            2>/dev/null || echo "⚠️ No cache release found, will download packages during build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract packages
        run: |
          mkdir -p /tmp/lfs-sources
          
          if ls /tmp/artifacts/lfs-packages-part-*.tar.gz 1>/dev/null 2>&1; then
            echo "Reassembling and extracting cached packages..."
            cat $(ls -v /tmp/artifacts/lfs-packages-part-*.tar.gz) | tar -xz -C /tmp/
            echo "✅ Cache restored successfully"
          else
            echo "⚠️ No cached packages found, will download during build"
          fi

      - name: Check cache status
        id: check
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "✅ Cache HIT: $(find /tmp/lfs-sources -type f | wc -l) files"
          else
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "❌ Cache MISS: Will download packages during build"
          fi

  release:
    needs: restore-cache
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write
      # Keyless (OIDC) cosign signing of the ISO, SHA256SUMS and SBOM below.
      id-token: write
    outputs:
      # base64-encoded "<sha256>  <name>" subjects consumed by the SLSA
      # provenance job, which is a reusable-workflow call and cannot run
      # its own steps.
      base64_subjects: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Relocate build scratch off /tmp tmpfs
        # ubuntu-latest moved to an Ubuntu 26 runner image whose /tmp is a
        # ~7.9G RAM-backed tmpfs; large profiles need multiple GB under
        # /tmp/lfs-build, which made builds die with ENOSPC. Bind the scratch
        # dirs onto the 145G root disk so every /tmp/lfs-* path below works
        # unchanged. Warn (never fail) if a runner cannot bind, so a runner
        # whose /tmp is already large is unaffected.
        run: |
          sudo mkdir -p /mnt/lfs-scratch
          for d in lfs-build lfs-sources base-cache; do
            sudo mkdir -p "/mnt/lfs-scratch/$d" "/tmp/$d"
            sudo mount --bind "/mnt/lfs-scratch/$d" "/tmp/$d" \
              || echo "::warning::could not bind /tmp/$d onto the root disk"
          done
          df -h /tmp /mnt/lfs-scratch

      - name: Restore package cache from release
        run: |
          mkdir -p /tmp/artifacts
          cd /tmp/artifacts
          
          gh release download packages-cache-latest \
            --repo ${{ github.repository }} \
            --pattern "lfs-packages-part-*.tar.gz" \
            2>/dev/null || echo "⚠️ Cache release not found"
          
          mkdir -p /tmp/lfs-sources
          if ls lfs-packages-part-*.tar.gz 1>/dev/null 2>&1; then
            cat $(ls -v lfs-packages-part-*.tar.gz) | tar -xz -C /tmp/ && echo "✅ Cache restored"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check LFS compatibility of shell scripts
        run: |
          python3 lfs_check.py --shellcheck

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev squashfs-tools ca-certificates \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Generate sources.list
        run: python3 builder.py --generate-sources-list

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Prepare lfs build directory
        run: |
          # /tmp/lfs-build is a bind mountpoint now: clear its CONTENTS, never
          # rm -rf the mountpoint itself (that fails with EBUSY).
          sudo rm -rf /tmp/lfs-build/* /tmp/lfs-build/.[!.]* 2>/dev/null || true
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Ensure sources directory is clean
        run: sudo rm -rf /tmp/lfs-build/build-release/sources

      - name: Link cached packages to build directory
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            sudo mkdir -p /tmp/lfs-build/build-release/sources
            sudo cp -v /tmp/lfs-sources/* /tmp/lfs-build/build-release/sources/ 2>/dev/null || true
            sudo chown -R lfs:lfs /tmp/lfs-build/build-release
            echo "✅ Linked $(($(find /tmp/lfs-sources -type f | wc -l))) cached packages"
          fi

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Ensure build directory is fully owned by lfs user
        run: sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Build release profile
        run: |
          cd /tmp/lfs-build
          CACHE_STATUS="${{ needs.restore-cache.outputs.cache-hit }}"
          echo "📦 Package cache status: $CACHE_STATUS"
          
          sudo -u lfs python3 builder.py \
            --profile xfce \
            --init sysvinit \
            --output ./build-release \
            --verbose \
            --download-timeout 600 \
            --download-retries 5
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Resolve ISO name
        id: iso_name
        run: |
          ISO_NAME=$(python3 -c "
          import sys; sys.path.insert(0, '/tmp/lfs-build')
          from builder import LFSBuilder
          from pathlib import Path
          b = LFSBuilder.__new__(LFSBuilder)
          b.profile = 'xfce'
          b.output_dir = Path('/tmp/lfs-build/build-release')
          b.milestone = None
          from builder import LFSConfig
          b.config = LFSConfig.__new__(LFSConfig)
          b.config.data = {'architecture': 'x86_64', 'init_system': {'choice': 'sysvinit'}}
          b.profile_config = {}
          print(b.get_iso_name())
          ")
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "📀 ISO name: $ISO_NAME"

      - name: Verify kernel and ISO
        run: |
          ls /tmp/lfs-build/build-release/image/boot/vmlinuz*
          test -s /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}
          sha256sum /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }} > /tmp/lfs-build/build-release/SHA256SUMS
          sha256sum /tmp/lfs-build/build-release/image/boot/vmlinuz* >> /tmp/lfs-build/build-release/SHA256SUMS

      - name: Generate provenance subjects
        id: subjects
        run: |
          set -euo pipefail
          cd /tmp/lfs-build/build-release
          # Bind the SLSA provenance to the published ISO and its manifest.
          files="${{ steps.iso_name.outputs.iso_name }} SHA256SUMS"
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create compat ISO pointer
        run: |
          cd /tmp/lfs-build/build-release || exit 1
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          # Release assets cannot be symlinks and copying the ISO would
          # duplicate gigabytes, so publish a tiny pointer that resolves
          # the backward-compatible lfs-installer.iso name.
          SHA=$(sha256sum "$ISO" | awk '{print $1}')
          {
            echo "iso_name=$ISO"
            echo "sha256=$SHA"
            echo "download_url=https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$ISO"
          } > lfs-installer.iso.pointer

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/build-release/image/boot/vmlinuz*
            /tmp/lfs-build/build-release/SHA256SUMS
            /tmp/lfs-build/build-release/build_info.json
            /tmp/lfs-build/build-release/lpm-repo/packages.list*
            /tmp/lfs-build/build-release/lpm-repo/*.tar.xz
            /tmp/lfs-build/build-release/lfs-installer.iso.pointer
          if-no-files-found: error

      - name: Boot ISO in QEMU (smoke test)
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          ISO_PATH="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          bash tools/qemu-boot-smoke.sh "$ISO_PATH"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/build-release/image/boot/vmlinuz*
            /tmp/lfs-build/build-release/build_info.json
            /tmp/lfs-build/build-release/SHA256SUMS
            /tmp/lfs-build/build-release/lpm-repo/packages.list*
            /tmp/lfs-build/build-release/lpm-repo/*.tar.xz
            /tmp/lfs-build/build-release/lfs-installer.iso.pointer
          generate_release_notes: true

      - name: Install cosign
        if: success()
        uses: sigstore/cosign-installer@v3
        continue-on-error: true

      - name: Generate SBOM
        if: success()
        continue-on-error: true
        run: |
          cd /tmp/lfs-build/build-release
          # Minimal SPDX document built from the LPM package manifest the
          # build already emits; the fallback keeps signing bound to a real
          # artifact when the manifest is absent.
          {
            echo "spdxVersion: SPDX-2.3"
            echo "dataLicense: CC0-1.0"
            echo "SPDXID: SPDXRef-DOCUMENT"
            echo "name: lfs-builder-${GITHUB_REF_NAME}"
            echo "packages:"
            if [ -f lpm-repo/packages.list ]; then
              sed 's/^/  - /' lpm-repo/packages.list
            else
              echo "  - lfs-builder"
            fi
          } > sbom.spdx

      - name: Sign release artifacts (cosign keyless)
        if: success()
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          cd /tmp/lfs-build/build-release
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          for f in "$ISO" SHA256SUMS sbom.spdx; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done

      - name: Publish signatures to release
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/lfs-build/build-release
          shopt -s nullglob
          bundles=( *.cosign.bundle )
          [ ${#bundles[@]} -gt 0 ] || exit 0
          gh release upload "${GITHUB_REF_NAME}" "${bundles[@]}" --clobber

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: /tmp/lfs-build/build-release/logs/

  provenance:
    # SLSA3 provenance for the published ISO/manifest.  Runs as a separate
    # reusable-workflow job so a signing/attestation failure can never block
    # the release artifacts already published by the `release` job.
    needs: release
    permissions:
      actions: read     # to read the workflow path
      id-token: write   # to sign the provenance
      contents: write   # to attach the attestation to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.release.outputs.base64_subjects }}"
      upload-assets: true