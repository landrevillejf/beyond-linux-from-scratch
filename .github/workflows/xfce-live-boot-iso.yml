name: XFCE SYSVINIT x86_64 Build Live ISO

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-live-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            squashfs-tools ca-certificates

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Create lfs user and build directory
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc
          sudo mkdir -p /tmp/lfs-build
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Generate sources list
        run: python3 builder.py --generate-sources-list

      - name: Cache LFS sources
        uses: actions/cache@v4
        with:
          path: /tmp/lfs-build/sources
          key: lfs-sources-xfce-live-${{ hashFiles('packages/sources.list') }}
          restore-keys: |
            lfs-sources-xfce-live-
            lfs-sources-

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Build live ISO with builder
        run: |
          sudo -u lfs python3 builder.py \
            --profile xfce \
            --init sysvinit \
            --output /tmp/lfs-build

      - name: Resolve ISO name
        id: iso_name
        run: |
          BUILDER_VERSION=$(python3 -c "from builder import __version__; print(__version__)")
          ISO_NAME="lfs-${BUILDER_VERSION}-xfce-x86_64-sysvinit.iso"
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "📀 ISO name: $ISO_NAME"

      - name: Verify kernel and ISO
        run: |
          ls -l /tmp/lfs-build/image/boot
          ls /tmp/lfs-build/image/boot/vmlinuz*
          test -s /tmp/lfs-build/${{ steps.iso_name.outputs.iso_name }}
          ls -lh /tmp/lfs-build/${{ steps.iso_name.outputs.iso_name }}

      - name: Compute checksums
        run: |
          sha256sum /tmp/lfs-build/${{ steps.iso_name.outputs.iso_name }} > /tmp/lfs-build/SHA256SUMS
          sha256sum /tmp/lfs-build/image/boot/vmlinuz* >> /tmp/lfs-build/SHA256SUMS
          cat /tmp/lfs-build/SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce-sysvinit-live-iso
          path: |
            /tmp/lfs-build/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/image/boot/vmlinuz*
            /tmp/lfs-build/SHA256SUMS
            /tmp/lfs-build/lpm-repo/packages.list*
            /tmp/lfs-build/lpm-repo/*.tar.xz

      - name: Create release tag metadata
        id: release_info
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        run: |
          VERSION=$(python3 -c "from builder import __version__; print(__version__)")
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}-xfce-live-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release with ISO and kernel
        if: steps.release_info.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: XFCE SYSVINIT Live ISO ${{ steps.release_info.outputs.tag }}
          body: |
            LFS/BLFS build artifact generated by builder.py
            - Profile: xfce
            - Init: sysvinit
            - ISO: ${{ steps.iso_name.outputs.iso_name }}
            - Includes: live ISO + compiled kernel + SHA256SUMS + LPM repository manifest
          files: |
            /tmp/lfs-build/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/image/boot/vmlinuz*
            /tmp/lfs-build/SHA256SUMS
            /tmp/lfs-build/lpm-repo/packages.list*
            /tmp/lfs-build/lpm-repo/*.tar.xz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-xfce-live-iso
          path: /tmp/lfs-build/logs/