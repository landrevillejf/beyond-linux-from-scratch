name: Project Looking Glass Builds

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg3d-builds
  cancel-in-progress: false

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier les commits des dernières 24 heures
        id: check
        run: |
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  ensure-base-cache:
    needs: check_changes
    if: needs.check_changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write
    outputs:
      status: ${{ steps.handshake.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 0

      - name: Wait for the base prefix cache for this commit
        id: handshake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PRODUCER: build-base-cache.yml
          DEADLINE_MIN: "270"
          POLL_SEC: "120"
        run: |
          # The runner executes every run: block as `bash -e {0}' even when
          # the script never says set -e (see TestBaseCacheRun7VerifyStep).
          # This step only reports, so -e is turned OFF explicitly.
          set +e
          status=unknown
          finish() {
            echo "status=${status}" >> "$GITHUB_OUTPUT"
            echo "base-cache handshake: ${status}"
            exit 0
          }
          has_asset() {
            # Exact string match against the asset list.  grep would let the
            # dots in the name match any character.
            gh release view base-cache-latest --repo "$REPO" --json assets \
              --jq '.assets[].name' 2>/dev/null \
              | awk -v want="$1" '$0 == want { found = 1 } END { exit !found }'
          }
          # Byte-for-byte the list the lg3d restore and the producer hash;
          # drift here is a permanent silent miss.  TestLg3dBaseCacheHandshake
          # pins all four copies equal.
          BASE_TREE=$(git ls-tree -r HEAD -- host \
            lfs/05a-build-lfs-basic.sh lfs/05b-build-lfs-system.sh \
            lfs/06a-init-system.sh lfs/06b-service-management.sh \
            lfs/07-configure-lfs.sh \
            blfs/08-build-blfs-base.sh blfs/08a-build-blfs-libs.sh \
            blfs/08b-build-xorg.sh blfs/08c-build-wayland.sh \
            blfs/08d-build-display-manager.sh \
            config packages/sources.list packages/custom-sources.list \
            builder.py VERSION)
          # Guard the blob list, not the digest: sha256sum of an empty stream
          # is a valid 12-hex value, so `[ -z "$BASE_KEY" ]' can never fire.
          if [ -z "$BASE_TREE" ]; then
            echo "::warning::no base cache key; the restore below will miss"
            echo "::warning::and build the prefix from scratch"
            status=key-unavailable
            finish
          fi
          BASE_KEY=$(printf '%s\n' "$BASE_TREE" | sha256sum | cut -c1-12)
          echo "Base cache key for ${HEAD_SHA:0:7}: ${BASE_KEY}"
          missing=()
          for init in sysvinit; do
            prefix="base-${init}-x86_64-${BASE_KEY}"
            if has_asset "${prefix}.tar.zst.part-00"; then
              echo "ready: ${prefix}"
            else
              echo "missing: ${prefix}"
              missing+=("$prefix")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            status=ready
            finish
          fi
          deadline=$(( $(date +%s) + DEADLINE_MIN * 60 ))
          dispatched=false
          while :; do
            still_missing=()
            for prefix in "${missing[@]}"; do
              has_asset "${prefix}.tar.zst.part-00" || still_missing+=("$prefix")
            done
            if [ ${#still_missing[@]} -eq 0 ]; then
              echo "The producer published every prefix this run needs."
              status=republished
              finish
            fi
            in_flight=$(gh run list --workflow "$PRODUCER" \
              --limit 10 --json databaseId,headBranch,headSha,status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' \
              2>/dev/null || echo 0)
            if [ "$in_flight" != "0" ]; then
              echo "Producer run in flight (${in_flight}); waiting ${POLL_SEC}s"
            elif [ "$dispatched" = false ]; then
              echo "No producer in flight, ${#still_missing[@]} prefix(es) missing"
              echo "Dispatching ${PRODUCER} on ${REF_NAME}"
              if gh workflow run "$PRODUCER" --repo "$REPO" --ref "$REF_NAME"; then
                dispatched=true
              else
                echo "::warning::dispatching ${PRODUCER} failed"
                echo "::warning::the restore below will miss and build from scratch"
                status=dispatch-failed
                finish
              fi
            else
              echo "Own dispatch ended, still missing: ${still_missing[*]}"
              echo "Giving up: the legs below rebuild the prefix from scratch"
              status=incomplete
              finish
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::base prefix still absent after ${DEADLINE_MIN}m"
              status=deadline
              finish
            fi
            sleep "$POLL_SEC"
          done

  build-profiles:
    needs: [check_changes, ensure-base-cache]
    if: needs.check_changes.outputs.has_changes == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        profile: [ lg3d ]
        init: [ sysvinit ]
        arch: [ x86_64 ]
        boot: [ bios ]
    permissions:
      contents: write
    env:
      HAVE_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      USE_BASE_CACHE: "true"
      BASE_CACHE_RESUME_STAGE: build-kernel
      BASE_CACHE_IMAGE_STAGE: disk-image
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Relocate build scratch off /tmp tmpfs
        run: |
          sudo mkdir -p /mnt/lfs-scratch
          for d in lfs-build lfs-sources base-cache; do
            sudo mkdir -p "/mnt/lfs-scratch/$d" "/tmp/$d"
            sudo chown "$(id -u):$(id -g)" "/mnt/lfs-scratch/$d" "/tmp/$d"
            sudo mount --bind "/mnt/lfs-scratch/$d" "/tmp/$d" \
              || echo "::warning::could not bind /tmp/$d onto the root disk"
          done
          df -h /tmp /mnt/lfs-scratch

      - name: Restore package cache from release
        run: |
          mkdir -p /tmp/artifacts
          cd /tmp/artifacts
          gh release download packages-cache-latest \
            --repo ${{ github.repository }} \
            --pattern "lfs-packages-part-*.tar.gz" \
            --pattern "SHA256SUMS" \
            2>/dev/null || echo "⚠️ No cache release found"
          mkdir -p /tmp/lfs-sources
          if ls lfs-packages-part-*.tar.gz 1>/dev/null 2>&1; then
            cat $(ls -v lfs-packages-part-*.tar.gz) | tar -xz -C /tmp/
            echo "Cache restored successfully"
          else
            echo "No cached packages found, will download during build"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check cache status
        id: check_cache
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Cache HIT: $(find /tmp/lfs-sources -type f | wc -l) files"
          else
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "Cache MISS: Will download packages during build"
          fi

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check LFS compatibility of shell scripts
        run: python3 lfs_check.py --shellcheck

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed, attempt $attempt of 3"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux syslinux-common mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev squashfs-tools ca-certificates \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: Install ARM64 cross tools
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            grub-efi-arm64-bin busybox-static

      - name: Install x86_64 GRUB EFI modules
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends grub-efi-amd64-bin ovmf

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Generate sources.list
        run: python3 builder.py --generate-sources-list

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      # ---------- TESTS (exécutés AVANT de préparer le build) ----------
      - name: Run tests
        run: python3 -m pytest tests/ -q

      # ---------- PREPARATION DU BUILD ----------
      - name: Prepare lfs build directory
        run: |
          # /tmp/lfs-build is a bind mountpoint now: clear its CONTENTS, never
          # rm -rf the mountpoint itself (that fails with EBUSY).
          sudo rm -rf /tmp/lfs-build/* /tmp/lfs-build/.[!.]* 2>/dev/null || true
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Link cached packages to build directory
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            sudo mkdir -p /tmp/lfs-build/build-release/sources
            sudo cp -v /tmp/lfs-sources/* /tmp/lfs-build/build-release/sources/ 2>/dev/null || true
            sudo chown -R lfs:lfs /tmp/lfs-build/build-release
            echo "✅ Linked $(($(find /tmp/lfs-sources -type f | wc -l))) cached packages"
            # The copy above duplicates several GB of tarballs; the base
            # prefix restore that follows needs the room.  Clear the bind
            # mount's CONTENTS, not the /tmp/lfs-sources mountpoint itself.
            sudo rm -rf /tmp/lfs-sources/* /tmp/lfs-sources/.[!.]* 2>/dev/null || true
            df -h /tmp
          fi

      - name: Pre-download private ProjectLookingGlass source
        env:
          PLG_TOKEN: ${{ secrets.PLG_SOURCE_TOKEN }}
        run: |
          if [ -z "$PLG_TOKEN" ]; then
            echo "::error::secrets.PLG_SOURCE_TOKEN is not set; cannot fetch the private ProjectLookingGlass archive"
            exit 1
          fi
          SRC_DIR=/tmp/lfs-build/build-release/sources
          TMP_TARBALL="$(mktemp)"
          HTTP_CODE=$(curl -sSL -w '%{http_code}' \
            -H "Authorization: Bearer ${PLG_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/landrevillejf/ProjectLookingGlass/tarball/main \
            -o "$TMP_TARBALL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::ProjectLookingGlass tarball fetch returned HTTP ${HTTP_CODE} (PLG_SOURCE_TOKEN lacks Contents:read on the repo, or the ref is wrong). Response body:"
            head -c 500 "$TMP_TARBALL"; echo
            rm -f "$TMP_TARBALL"
            exit 1
          fi
          if ! gzip -t "$TMP_TARBALL"; then
            echo "::error::downloaded body is not a valid gzip archive; first bytes:"
            head -c 300 "$TMP_TARBALL"; echo
            rm -f "$TMP_TARBALL"
            exit 1
          fi
          sudo mkdir -p "$SRC_DIR"
          sudo cp "$TMP_TARBALL" "$SRC_DIR/ProjectLookingGlass-main.tar.gz"
          sudo chown lfs:lfs "$SRC_DIR/ProjectLookingGlass-main.tar.gz"
          rm -f "$TMP_TARBALL"
          echo "Staged ProjectLookingGlass-main.tar.gz into ${SRC_DIR}"

      - name: Ensure fresh kernel
        run: |
          sudo rm -f /tmp/lfs-build/build-release/sources/linux-*.tar.xz
          echo "🗑️ Removed cached kernel to force fresh download for all architectures"

      - name: Enable UEFI support for lg3d profile
        if: matrix.boot != 'bios'
        run: |
          cd /tmp/lfs-build
          sudo python3 -c "
          import json
          with open('config/build.conf', 'r') as f:
              config = json.load(f)
          config['bootloader']['uefi_support'] = True
          config['bootloader']['esp_size_mb'] = 512
          with open('config/build.conf', 'w') as f:
              json.dump(config, f, indent=2)
          print('UEFI support enabled in build.conf')
          "
          sudo chown lfs:lfs config/build.conf
          python3 -m json.tool config/build.conf > /dev/null && echo "build.conf is valid JSON"

      - name: Debug sources directory before build
        run: |
          echo "Sources directory:"
          ls -la /tmp/lfs-build/build-release/sources/ | awk 'NR <= 30'
          echo "files in sources : $(find /tmp/lfs-build/build-release/sources/ -maxdepth 1 -type f | wc -l)"

      - name: Ensure build directory is fully owned by lfs user
        run: sudo chown -R lfs:lfs /tmp/lfs-build

      # ------- BASE PREFIX CACHE -------
      - name: Restore base prefix cache
        id: base_cache
        if: env.USE_BASE_CACHE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INIT="${{ matrix.init }}"
          ARCH="${{ matrix.arch }}"
          BASE_KEY=$(git ls-tree -r HEAD -- host \
            lfs/05a-build-lfs-basic.sh lfs/05b-build-lfs-system.sh \
            lfs/06a-init-system.sh lfs/06b-service-management.sh \
            lfs/07-configure-lfs.sh \
            blfs/08-build-blfs-base.sh blfs/08a-build-blfs-libs.sh \
            blfs/08b-build-xorg.sh blfs/08c-build-wayland.sh \
            blfs/08d-build-display-manager.sh \
            config packages/sources.list packages/custom-sources.list \
            builder.py VERSION | sha256sum | cut -c1-12)
          PREFIX="base-${INIT}-${ARCH}-${BASE_KEY}"
          HIT=false
          mkdir -p /tmp/base-cache
          sudo chown "$(id -u):$(id -g)" /tmp/base-cache
          cd /tmp/base-cache
          echo "Looking for ${PREFIX} in base-cache-latest"
          echo "ensure-base-cache status: ${{ needs.ensure-base-cache.outputs.status }}"
          if gh release download base-cache-latest \
            --repo ${{ github.repository }} \
            --pattern "${PREFIX}.tar.zst.part-*" \
            --pattern "${PREFIX}.sha256"; then
            if sha256sum -c "${PREFIX}.sha256"; then
              df -h /tmp
              sudo mkdir -p /tmp/lfs-build/build-release
              if cat $(ls -v "${PREFIX}".tar.zst.part-*) \
                | sudo tar --zstd --numeric-owner --xattrs \
                  -xf - -C /tmp/lfs-build/build-release; then
                sudo chown lfs:lfs /tmp/lfs-build
                sudo chown -R "$(id -u lfs):$(id -g lfs)" \
                  /tmp/lfs-build/build-release
                sudo mkdir -p \
                  /tmp/lfs-build/build-release/dev/pts \
                  /tmp/lfs-build/build-release/dev/shm \
                  /tmp/lfs-build/build-release/proc \
                  /tmp/lfs-build/build-release/sys \
                  /tmp/lfs-build/build-release/run/lock
                HIT=true
              else
                echo "Base cache extraction failed - building from scratch"
              fi
            else
              echo "Base cache checksum mismatch - building from scratch"
            fi
          else
            echo "No base cache published for ${PREFIX} - building from scratch"
          fi
          rm -f "${PREFIX}".tar.zst.part-* "${PREFIX}.sha256"
          df -h /tmp
          du -sh /tmp/lfs-build/build-release 2>/dev/null || true
          echo "hit=${HIT}" >> "$GITHUB_OUTPUT"
          echo "Base prefix cache hit: ${HIT}"

      - name: Recreate disk image after cache restore
        if: steps.base_cache.outputs.hit == 'true'
        run: |
          cd /tmp/lfs-build
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            PROFILE="arm64"
          else
            PROFILE="${{ matrix.profile }}"
          fi
          sudo -u lfs python3 builder.py \
            --profile "$PROFILE" \
            --init ${{ matrix.init }} \
            --arch ${{ matrix.arch }} \
            --output ./build-release \
            --verbose \
            --resume-from "$BASE_CACHE_IMAGE_STAGE" \
            --stop-after "$BASE_CACHE_IMAGE_STAGE" \
            --download-timeout 600 \
            --download-retries 5 \
            --stage-timeout 18000
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      # Resolved BEFORE the build, and unconditionally: the upload step below
      # runs `if: always()`, and an empty iso_name collapses its first path
      # entry to the bare rootfs directory, which makes upload-artifact scandir
      # the whole tree and die on the first root-owned 0750 directory
      # (Nightly #1: EACCES on /etc/audit/plugins.d, masking the real failure).
      #
      # This step must never be able to fail: it now precedes the build step,
      # which has no `if: always()`, so an abort here would cost the whole ISO.
      # Hence `set +e`, a VERSION-file fallback for the import, `dev` (the same
      # fallback builder.py's _get_version() uses) for an unreadable VERSION,
      # and an unconditional `exit 0`.
      - name: Resolve ISO name
        id: iso_name
        if: always()
        run: |
          set +e
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            PROFILE="arm64"
            ARCH="aarch64"
          else
            PROFILE="${{ matrix.profile }}"
            ARCH="${{ matrix.arch }}"
          fi
          BUILDER_VERSION=$(python3 -c "from builder import __version__; print(__version__)" 2>/dev/null)
          if [ -z "$BUILDER_VERSION" ]; then
            BUILDER_VERSION=$(cat VERSION 2>/dev/null)
            echo "builder import failed; falling back to the VERSION file ('${BUILDER_VERSION}')"
          fi
          if [ -z "$BUILDER_VERSION" ]; then
            BUILDER_VERSION="dev"
            echo "::warning::no builder version available; falling back to 'dev'"
          fi
          DATE=$(date +%Y%m%d)
          ISO_NAME="lfs-${BUILDER_VERSION}-${PROFILE}-${ARCH}-${{ matrix.init }}-${DATE}.iso"
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "ISO name: $ISO_NAME"
          exit 0

      # ------- BUILD -------
      - name: Build release profile ${{ matrix.profile }} / ${{ matrix.init }} / ${{ matrix.arch }}
        run: |
          cd /tmp/lfs-build
          CACHE_STATUS="${{ steps.check_cache.outputs.hit }}"
          echo "📦 Package cache status: $CACHE_STATUS"

          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            PROFILE="arm64"
          else
            PROFILE="${{ matrix.profile }}"
          fi

          RESUME_ARGS=""
          if [ "${{ steps.base_cache.outputs.hit }}" == "true" ]; then
            RESUME_ARGS="--resume-from $BASE_CACHE_RESUME_STAGE"
            echo "♻️ Base cache hit: resuming from $BASE_CACHE_RESUME_STAGE"
          else
            echo "⚠️ Base cache miss: building from scratch (host-check)"
          fi

          sudo -u lfs python3 builder.py \
            --profile "$PROFILE" \
            --init ${{ matrix.init }} \
            --arch ${{ matrix.arch }} \
            --boot ${{ matrix.boot }} \
            --output ./build-release \
            --verbose \
            --nightly \
            --sbom \
            $RESUME_ARGS \
            --stage-timeout 18000 \
            --download-timeout 600 \
            --download-retries 5
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Verify kernel and boot artifact
        run: |
          SUFFIX="${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}"
          ISO="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          KERNEL_SRC=$(find /tmp/lfs-build/build-release/boot -name "vmlinuz*" | head -n1)
          test -n "$KERNEL_SRC"
          if [ -f "$ISO" ]; then
            test -s "$ISO"
            ARTIFACT="$ISO"
          else
            ARTIFACT="/tmp/lfs-build/build-release.img"
            test -s "$ARTIFACT"
          fi
          sudo cp "$KERNEL_SRC" "/tmp/lfs-build/build-release/vmlinuz-${SUFFIX}"
          cd /tmp/lfs-build/build-release || exit 1
          sudo sha256sum "$ARTIFACT" "vmlinuz-${SUFFIX}" | sudo tee "SHA256SUMS-${SUFFIX}" >/dev/null

      - name: Sign ISO with GPG
        if: env.HAVE_GPG_KEY == 'true'
        run: |
          export GNUPGHOME=/tmp/gpg-nightly
          sudo mkdir -p "$GNUPGHOME"
          sudo chown lfs:lfs "$GNUPGHOME"
          sudo chmod 700 "$GNUPGHOME"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | sudo -u lfs env GNUPGHOME="$GNUPGHOME" gpg --batch --import
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          [ -f "/tmp/lfs-build/build-release/$ISO" ] || { echo "No ISO for this profile, skipping"; sudo rm -rf "$GNUPGHOME"; exit 0; }
          sudo -u lfs env GNUPGHOME="$GNUPGHOME" GPG_PASS='${{ secrets.GPG_PASSPHRASE }}' bash -c '
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASS" \
              --local-user "${{ vars.GPG_KEY_ID }}" \
              --detach-sign --armor \
              --output "/tmp/lfs-build/build-release/${0}.sig" \
              "/tmp/lfs-build/build-release/${0}"
          ' "$ISO"
          echo "ISO signed: ${ISO}.sig"
          sudo rm -rf "$GNUPGHOME"

      - name: Create compat ISO pointer
        run: |
          cd /tmp/lfs-build/build-release || exit 1
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          if [ ! -f "$ISO" ]; then
            echo "No ISO for this profile, skipping pointer"
            exit 0
          fi
          SHA=$(sudo sha256sum "$ISO" | awk '{print $1}')
          {
            echo "iso_name=$ISO"
            echo "sha256=$SHA"
            echo "download_url=https://github.com/${{ github.repository }}/releases/download/lg3d-nightly-$(date +%Y%m%d)/$ISO"
          } | sudo tee lfs-installer.iso.pointer >/dev/null

      - name: Export split rootfs tarball
        if: matrix.profile == 'xfce' || matrix.profile == 'arm64'
        run: |
          SUFFIX="${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}"
          sudo tar --zstd -cf - -C /tmp/lfs-build/build-release \
            --exclude=./sources --exclude=./logs --exclude=./cache \
            --exclude=./backups --exclude=./live --exclude=./image \
            --exclude=./tools --exclude=./packages --exclude=./lpm-repo \
            --exclude=./proc --exclude=./sys --exclude=./dev \
            --exclude=./run --exclude=./lost+found \
            --exclude=./build_info.json --exclude=./sbom.spdx.json \
            --exclude=./*.iso --exclude=./*.iso.sig \
            --exclude=./vmlinuz-* --exclude=./SHA256SUMS-* \
            --exclude=./lfs-installer.iso.pointer \
            . | sudo split -b 1900m -d -a 2 - "/tmp/lfs-build/rootfs-${SUFFIX}.tar.zst.part-"
          sudo mv /tmp/lfs-build/rootfs-${SUFFIX}.tar.zst.part-* /tmp/lfs-build/build-release/
          cd /tmp/lfs-build/build-release || exit 1
          sudo chown lfs:lfs rootfs-${SUFFIX}.tar.zst.part-*
          sha256sum rootfs-${SUFFIX}.tar.zst.part-* | sudo tee -a "SHA256SUMS-${SUFFIX}" >/dev/null
          du -h rootfs-${SUFFIX}.tar.zst.part-*

      - name: Rename shared-name artifacts per profile
        run: |
          cd /tmp/lfs-build/build-release || exit 1
          SUFFIX="${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}"
          sudo mv build_info.json "build_info-${SUFFIX}.json"
          if [ -f sbom.spdx.json ]; then
            sudo mv sbom.spdx.json "sbom-${SUFFIX}.spdx.json"
          fi
          if ls lpm-repo/packages.list* >/dev/null 2>&1; then
            for f in lpm-repo/packages.list*; do
              sudo mv "$f" "lpm-repo/$(basename "$f")-${SUFFIX}"
            done
          fi

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.profile }}-${{ matrix.init }}-${{ matrix.arch }}
          path: |
            /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/build-release/vmlinuz-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}
            /tmp/lfs-build/build-release/SHA256SUMS-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}
            /tmp/lfs-build/build-release/build_info-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}.json
            /tmp/lfs-build/build-release/sbom-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}.spdx.json
            /tmp/lfs-build/build-release/lpm-repo/packages.list*
            /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}.sig
            /tmp/lfs-build/build-release/lfs-installer.iso.pointer
            /tmp/lfs-build/build-release/rootfs-*.tar.zst.part-*
          if-no-files-found: ignore

      - name: Boot artifact in QEMU (smoke test - BIOS mode)
        if: success() && matrix.arch == 'x86_64'
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed, attempt $attempt of 3"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          sudo apt-get install -y qemu-system-x86
          ISO_PATH="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          if [ -f /tmp/lfs-build/build-release.img ]; then
            sudo chmod a+rw /tmp/lfs-build/build-release.img
          fi
          if [ -f "$ISO_PATH" ]; then
            bash tools/qemu-boot-smoke.sh "$ISO_PATH"
          elif [ -f /tmp/lfs-build/build-release.img ]; then
            bash tools/qemu-boot-smoke.sh /tmp/lfs-build/build-release.img \
              /tmp/lfs-build/build-release
          else
            echo "No bootable artifact (ISO or disk image) found" >&2
            exit 1
          fi

      - name: Boot artifact in QEMU (smoke test - UEFI mode)
        if: success() && matrix.arch == 'x86_64' && matrix.boot != 'bios'
        run: |
          ISO_PATH="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          [ -f "$ISO_PATH" ] || {
            echo "No ISO produced for this profile, skipping UEFI smoke test"
            exit 0
          }
          OVMF_FW=""
          for candidate in \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/ovmf/OVMF.fd \
            /usr/share/OVMF/OVMF_CODE_4M.fd; do
            if [ -f "$candidate" ]; then
              OVMF_FW="$candidate"
              break
            fi
          done
          if [ -z "$OVMF_FW" ]; then
            echo "::warning::OVMF firmware not found, cannot test UEFI boot"
            exit 0
          fi
          echo "Using OVMF firmware: $OVMF_FW"
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          OVMF_VARS_SRC=""
          for v in \
            /usr/share/OVMF/OVMF_VARS.fd \
            /usr/share/ovmf/OVMF_VARS.fd \
            /usr/share/OVMF/OVMF_VARS_4M.fd; do
            if [ -f "$v" ]; then
              OVMF_VARS_SRC="$v"
              break
            fi
          done
          VARS_ARG=""
          if [ -n "$OVMF_VARS_SRC" ]; then
            cp "$OVMF_VARS_SRC" "$WORKDIR/ovmf-vars.fd"
            VARS_ARG="-drive if=pflash,format=raw,file=$WORKDIR/ovmf-vars.fd"
          fi
          timeout 420 qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -m 2G -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_FW" \
            $VARS_ARG \
            -cdrom "$ISO_PATH" \
            -boot order=d \
            -display none -serial file:"$WORKDIR/uefi-boot.log" \
            -monitor none -no-reboot || true
          LOG="$WORKDIR/uefi-boot.log"
          if grep -aqE "DOS magic is invalid|you need to load the kernel first|Failed to boot both default and fallback|error: file .* not found" "$LOG"; then
            echo "::error::UEFI boot failed: GRUB EFI ran but could not boot the kernel"
            grep -aoE "error: .*" "$LOG" | tr -d '\000' | sort -u | head
            exit 1
          fi
          if grep -aqE "Kernel panic|VFS: Unable to mount root fs|Freezing execution|Press Enter to continue|FAILURE:|unknown filesystem type|Failed to mount cgroup" "$LOG"; then
            echo "::error::UEFI boot reached the rootfs and aborted there"
            grep -aoE "(Kernel panic.*|VFS: Unable to mount root fs.*|Freezing execution|Press Enter to continue.*|FAILURE:.*|unknown filesystem type.*|Failed to mount cgroup.*)" "$LOG" \
              | tr -d '\000' | sort -u | head
            exit 1
          fi
          if grep -aqE "Live media detected|Mounting root:|Reached target|Create symlinks in /dev targeting /proc|Setting kernel runtime parameters" "$LOG"; then
            echo "UEFI boot successful: firmware -> GRUB EFI -> kernel -> initramfs root logic"
            grep -aoE "GRUB version [0-9.]+|Linux version [^ ]+|Live media detected" "$LOG" | sort -u | head
          else
            echo "::error::UEFI boot failed: firmware never reached the initramfs root logic"
            tail -n 40 "$LOG" | tr -d '\000'
            exit 1
          fi

      - name: Boot the ISO through the BIOS firmware (isolinux path)
        if: success() && matrix.arch == 'x86_64'
        run: |
          ISO_PATH="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          [ -f "$ISO_PATH" ] || {
            echo "No ISO produced for this profile, skipping the BIOS firmware boot"
            exit 0
          }
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          timeout 420 qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -m 2G -smp 2 \
            -cdrom "$ISO_PATH" \
            -boot order=d \
            -display none -serial file:"$WORKDIR/bios-firmware.log" \
            -monitor none -no-reboot || true
          LOG="$WORKDIR/bios-firmware.log"
          if grep -aqE "Freezing execution|Press Enter to continue|FAILURE:|unknown filesystem type|Failed to mount cgroup|cannot create directory '/sys/fs/cgroup'|Failed to mount API filesystems|Entering emergency mode|Kernel panic|VFS: Unable to mount root fs" "$LOG"; then
            echo "::error::BIOS firmware boot reached an init that aborted"
            grep -aoE "(Kernel panic.*|VFS: Unable to mount root fs.*|Freezing execution|Press Enter to continue.*|FAILURE:.*|unknown filesystem type.*|Failed to mount cgroup.*)" "$LOG" \
              | tr -d '\000' | sort -u | head
            exit 1
          fi
          if grep -aqE "Live media detected|Mounting root:|Reached target|Create symlinks in /dev targeting /proc|Setting kernel runtime parameters" "$LOG"; then
            echo "BIOS firmware boot successful: SeaBIOS -> El Torito -> isolinux -> kernel -> initramfs root logic"
            grep -aoE "Linux version [^ ]+|Live media detected" "$LOG" | sort -u | head
          else
            echo "::error::BIOS firmware boot never reached the initramfs root logic"
            tail -n 40 "$LOG" | tr -d '\000'
            exit 1
          fi

      - name: Verify the ISO is BIOS+UEFI hybrid
        if: success() && matrix.arch == 'x86_64' && matrix.boot != 'bios'
        run: |
          ISO_PATH="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          [ -f "$ISO_PATH" ] || {
            echo "No ISO produced for this profile, skipping the hybrid check"
            exit 0
          }
          if ! command -v xorriso >/dev/null; then
            echo "::warning::xorriso absent, cannot verify hybrid structure"
            exit 0
          fi
          BOOT_RECORD=$(xorriso -indev "$ISO_PATH" -report_system_area as_plain 2>&1 \
            | grep -a "Boot record" || true)
          echo "ISO system area: ${BOOT_RECORD:-none reported}"
          gaps=0
          for want in "El Torito" "MBR isohybrid" "GPT"; do
            case "$BOOT_RECORD" in
              *"$want"* ) echo "hybrid layout carries $want" ;;
              * ) echo "::error::Boot record carries no $want"; gaps=1 ;;
            esac
          done
          if [ "$(fdisk -l "$ISO_PATH" 2>/dev/null | grep -c "ef EFI" || true)" = "0" ]; then
            echo "::error::no EFI System Partition in the hybrid MBR"
            gaps=1
          else
            echo "hybrid layout carries an ESP partition"
          fi
          if [ "$gaps" -ne 0 ]; then
            echo "::error::the ISO is not a BIOS+UEFI hybrid image"
            exit 1
          fi
          echo "Hybrid structure verified (El Torito + isohybrid MBR + GPT ESP)"

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.profile }}-${{ matrix.init }}-${{ matrix.arch }}
          path: /tmp/lfs-build/build-release/logs/
          if-no-files-found: ignore

  create-release:
    needs: build-profiles
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Compute nightly date
        id: date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: artifacts

      - name: Check that a profile produced artifacts
        id: artifacts
        run: |
          if [ -n "$(find artifacts -type f -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            find artifacts -type f
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No profile produced release artifacts; skipping the release."
          fi

      - name: Create Release
        if: steps.artifacts.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lg3d-nightly-${{ steps.date.outputs.date }}
          name: Project Looking Glass Nightly Build ${{ steps.date.outputs.date }}
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: true
          make_latest: false

      - name: Install cosign
        if: steps.artifacts.outputs.found == 'true'
        uses: sigstore/cosign-installer@v3
        continue-on-error: true

      - name: Sign nightly manifests (cosign keyless)
        if: steps.artifacts.outputs.found == 'true'
        continue-on-error: true
        env:
          COSIGN_YES: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t manifests < <(find artifacts -type f -name 'SHA256SUMS-*')
          [ ${#manifests[@]} -gt 0 ] || exit 0
          bundles=()
          for f in "${manifests[@]}"; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f" \
              && bundles+=("${f}.cosign.bundle")
          done
          if [ ${#bundles[@]} -gt 0 ]; then
            gh release upload "lg3d-nightly-${{ steps.date.outputs.date }}" \
              "${bundles[@]}" --clobber
          fi

      - name: Prune lg3d nightly releases older than 30 days
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y%m%d)
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease==true and (.tagName|startswith("lg3d-nightly-"))) | .tagName' \
            | while read -r tag; do
                day="${tag#lg3d-nightly-}"
                if [ "$day" -lt "$CUTOFF" ] 2>/dev/null; then
                  echo "Deleting old lg3d nightly release: $tag"
                  gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
                fi
              done
