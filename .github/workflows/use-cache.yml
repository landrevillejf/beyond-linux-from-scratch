name: Use Package Cache

# This is a reusable workflow that downloads cached packages
# Usage in other workflows:
# - uses: ./.github/workflows/use-cache.yml

on:
  workflow_call:
    outputs:
      cache-hit:
        description: 'Whether package cache was found'
        value: ${{ jobs.restore-cache.outputs.hit }}
      packages-path:
        description: 'Path to extracted packages'
        value: /tmp/lfs-sources

jobs:
  restore-cache:
    name: Restore Package Cache
    runs-on: ubuntu-latest
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Relocate build scratch off /tmp tmpfs
        # ubuntu-latest moved to an Ubuntu 26 runner image whose /tmp is a
        # ~7.9G RAM-backed tmpfs; the restored package cache is multiple GB
        # under /tmp/lfs-sources, which made this job die with ENOSPC. Bind
        # the scratch dirs onto the 145G root disk so every /tmp/lfs-* path
        # below works unchanged. Warn (never fail) if a runner cannot bind.
        run: |
          sudo mkdir -p /mnt/lfs-scratch
          for d in lfs-build lfs-sources base-cache; do
            sudo mkdir -p "/mnt/lfs-scratch/$d" "/tmp/$d"
            # sudo-created => root-owned; hand to the runner so unprivileged
            # steps (e.g. the package-cache `tar -xz -C /tmp/`) can write here.
            sudo chown "$(id -u):$(id -g)" "/mnt/lfs-scratch/$d" "/tmp/$d"
            sudo mount --bind "/mnt/lfs-scratch/$d" "/tmp/$d" \
              || echo "::warning::could not bind /tmp/$d onto the root disk"
          done
          df -h /tmp /mnt/lfs-scratch

      - name: Download cached packages
        uses: actions/download-artifact@v4
        with:
          name: lfs-blfs-packages-cache
          path: /tmp/artifacts/
        continue-on-error: true

      - name: Extract packages
        run: |
          mkdir -p /tmp/lfs-sources
          
          if [ -f /tmp/artifacts/lfs-packages-part-1.tar.gz ]; then
            echo "Extracting cached packages..."
            tar -xzf /tmp/artifacts/lfs-packages-part-1.tar.gz -C /tmp/
            echo "✅ Cache restored successfully"
          else
            echo "⚠️ No cached packages found"
          fi

      - name: Check cache status
        id: check
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f | wc -l) -gt 0 ]; then
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "✅ Cache HIT: $(find /tmp/lfs-sources -type f | wc -l) files"
          else
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "❌ Cache MISS"
          fi
