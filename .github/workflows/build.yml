name: Build LFS ISO

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        default: 'minimal'
        type: choice
        options:
          - minimal
          - xfce
          - gnome
          - secure
          - server
          - arm64
      init:
        description: 'Init system'
        default: 'sysvinit'
        type: choice
        options:
          - sysvinit
          - systemd
      no_live:
        description: 'Disable live system (faster)'
        type: boolean
        default: false
      output_dir:
        description: 'Output directory'
        default: './lfs-build'
      verbose:
        description: 'Verbose logging'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 heures max

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gawk texinfo wget \
            xorriso parted qemu-user-static

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: pip install pytest-bdd pytest-cov

      - name: Run BDD tests
        run: pytest tests/features/ -v --no-cov

      - name: Generate sources.list
        run: python3 builder.py --generate-sources-list

      - name: Cache sources
        id: cache-sources
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/lfs-build/sources
          key: sources-${{ hashFiles('packages/sources.list') }}
          restore-keys: |
            sources-

      - name: Build LFS
        id: build
        run: |
          CMD="python3 builder.py --profile ${{ inputs.profile || 'minimal' }} \
               --init ${{ inputs.init || 'sysvinit' }} \
               --output ${{ inputs.output_dir || './lfs-build' }}"
          if [ "${{ inputs.no_live }}" = "true" ]; then CMD="$CMD --no-live"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then CMD="$CMD --verbose"; fi
          sudo -E bash -c "$CMD"
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Verify kernel presence
        run: |
          IMAGE_DIR="${{ inputs.output_dir || './lfs-build' }}/image"
          if [ ! -d "$IMAGE_DIR/boot" ]; then
            echo "Boot directory not found in $IMAGE_DIR – build failed?"
            exit 1
          fi
          if ! ls "$IMAGE_DIR"/boot/vmlinuz* >/dev/null 2>&1; then
            echo "Kernel not found in $IMAGE_DIR/boot – build failed!"
            ls -la "$IMAGE_DIR"/boot || true
            exit 1
          fi
          echo "Kernel found: $(ls "$IMAGE_DIR"/boot/vmlinuz*)"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-iso-${{ inputs.profile || 'minimal' }}-${{ inputs.init || 'sysvinit' }}
          path: ${{ inputs.output_dir || './lfs-build' }}/lfs-installer.iso
          if-no-files-found: error

      - name: Upload build info
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: ${{ inputs.output_dir || './lfs-build' }}/build_info.json

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ inputs.output_dir || './lfs-build' }}/lfs-installer.iso
            ${{ inputs.output_dir || './lfs-build' }}/build_info.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show last logs on failure
        if: failure()
        run: |
          echo "=== Last 100 lines of build.log ==="
          tail -n 100 ${{ inputs.output_dir || './lfs-build' }}/logs/build.log 2>/dev/null || echo "Log file not found"
          echo "=== End of log ==="