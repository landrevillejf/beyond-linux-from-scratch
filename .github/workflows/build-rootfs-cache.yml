name: Build Rootfs Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 15 * *'

permissions:
  contents: write

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            squashfs-tools jq zstd ca-certificates sed \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml jinja2 requests

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Download package cache (all parts)
        id: get_packages
        run: |
          RELEASES_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/packages-cache-latest"
          ASSETS=$(curl -fsSL "$RELEASES_URL" | jq -r '
            .assets[]? |
            select(.name | test("^lfs-packages-part-[0-9][0-9]\\.tar\\.gz$")) |
            .browser_download_url
          ' | sort)
          if [ -z "$ASSETS" ]; then
            echo "No package cache parts found. Run the package cache workflow first."
            exit 1
          fi
          echo "asset_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download and combine parts
        run: |
          sudo mkdir -p /tmp/lfs-sources
          cd /tmp
          while IFS= read -r url; do
            echo "Downloading $url"
            wget -q --show-progress -O - "$url" >> packages-combined.tar.gz
          done <<< "${{ steps.get_packages.outputs.asset_urls }}"
          if [ ! -s packages-combined.tar.gz ]; then
            echo "Combined archive is empty."
            exit 1
          fi
          echo "Combined size: $(du -h packages-combined.tar.gz | cut -f1)"

      - name: Extract sources
        run: |
          cd /tmp
          sudo tar -xzf packages-combined.tar.gz -C /tmp/lfs-sources --strip-components=1
          ls -lh /tmp/lfs-sources/ | head -20

      - name: Prepare build directory
        run: |
          sudo rm -rf /tmp/lfs-build
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Link cached packages to build directory
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            sudo mkdir -p /tmp/lfs-build/build-release/sources
            sudo cp -v /tmp/lfs-sources/* /tmp/lfs-build/build-release/sources/ 2>/dev/null || true
            sudo chown -R lfs:lfs /tmp/lfs-build/build-release
            echo "✅ Linked $(find /tmp/lfs-sources -type f | wc -l) cached packages"
          fi

      - name: Build LFS root filesystem (via builder.py)
        run: |
          cd /tmp/lfs-build
          sudo -u lfs python3 builder.py \
            --profile xfce \
            --init sysvinit \
            --output ./build-release \
            --verbose \
            --download-timeout 600 \
            --download-retries 5
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-build-logs
          path: /tmp/lfs-build/build-release/logs/

      - name: Verify kernel presence
        run: |
          ls -l /tmp/lfs-build/build-release/image/boot/vmlinuz* || { echo "No kernel built"; exit 1; }

      - name: Compress rootfs
        run: |
          sudo tar --zstd -cf rootfs-cache-$(date +%Y%m%d).tar.zst -C /tmp/lfs-build/build-release/image .
          ls -lh rootfs-cache-*.tar.zst

      - name: Generate release body
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            echo '# 🖥️ LFS Root Filesystem Cache'
            echo ''
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Size: $(du -sh rootfs-cache-*.tar.zst | cut -f1)"
            echo ''
            echo 'Contient le noyau et les outils de base.'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Upload rootfs cache to release
        uses: softprops/action-gh-release@v2
        with:
          files: rootfs-cache-*.tar.zst
          tag_name: rootfs-cache-latest
          name: LFS Root Filesystem Cache
          body: ${{ steps.release_body.outputs.body }}
          prerelease: true
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "# ✅ Rootfs cache updated" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY