name: Build Rootfs Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 15 * *'

permissions:
  contents: write

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # grub-efi-amd64-bin provides /usr/lib/grub/x86_64-efi/, which
          # final/14 preflights by path before building the installer ISO.
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            squashfs-tools jq zstd ca-certificates sed \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
            grub-efi-amd64-bin busybox-static

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml jinja2 requests

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Download package cache (all parts)
        id: get_packages
        run: |
          RELEASES_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/packages-cache-latest"
          ASSETS=$(curl -fsSL "$RELEASES_URL" | jq -r '
            .assets[]? |
            select(.name | test("^lfs-packages-part-[0-9][0-9]\\.tar\\.gz$")) |
            .browser_download_url
          ' | sort)
          if [ -z "$ASSETS" ]; then
            echo "No package cache parts found. Run the package cache workflow first."
            exit 1
          fi
          echo "asset_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download and combine parts
        run: |
          sudo mkdir -p /tmp/lfs-sources
          cd /tmp
          while IFS= read -r url; do
            echo "Downloading $url"
            wget -q --show-progress -O - "$url" >> packages-combined.tar.gz
          done <<< "${{ steps.get_packages.outputs.asset_urls }}"
          if [ ! -s packages-combined.tar.gz ]; then
            echo "Combined archive is empty."
            exit 1
          fi
          echo "Combined size: $(du -h packages-combined.tar.gz | cut -f1)"

      - name: Extract sources
        run: |
          cd /tmp
          sudo tar -xzf packages-combined.tar.gz -C /tmp/lfs-sources --strip-components=1
          ls -lh /tmp/lfs-sources/ | head -20

      - name: Prepare build directory
        run: |
          sudo rm -rf /tmp/lfs-build
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Link cached packages to build directory
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            sudo mkdir -p /tmp/lfs-build/build-release/sources
            sudo cp -v /tmp/lfs-sources/* /tmp/lfs-build/build-release/sources/ 2>/dev/null || true
            sudo chown -R lfs:lfs /tmp/lfs-build/build-release
            echo "✅ Linked $(find /tmp/lfs-sources -type f | wc -l) cached packages"
          fi

      - name: Build LFS root filesystem
        run: |
          cd /tmp/lfs-build
          # --arch x86_64 is not redundant.  config/build.conf ships
          # architecture=aarch64 with cross_compile=true, and the xfce
          # profile overrides neither, so without it this job would try to
          # cross-compile an arm64 system on an x86_64 runner and publish a
          # rootfs build-iso-from-cache.yml could never boot.
          sudo -u lfs python3 builder.py \
            --profile xfce \
            --init sysvinit \
            --arch x86_64 \
            --output ./build-release \
            --verbose \
            --download-timeout 600 \
            --download-retries 5
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-build-logs
          path: /tmp/lfs-build/build-release/logs/

      - name: Verify kernel presence
        run: |
          # builder.py sets LFS to the resolved output directory, so the
          # rootfs *is* build-release/ and the kernel lands in
          # build-release/boot.  build-release/image/ is created empty by
          # prepare_environment() and populated by nothing, so the
          # `ls image/boot/vmlinuz*` this replaced could never succeed and
          # the tarball beside it shipped an empty archive.
          ls -l /tmp/lfs-build/build-release/boot/vmlinuz* || { echo "No kernel built"; exit 1; }

      - name: Compress rootfs (split parts)
        run: |
          # Release assets are capped at 2 GB: stream the zstd tarball
          # straight into split parts, same convention as cache-packages.
          #
          # Tar build-release/ itself, not build-release/image/, and name the
          # build scaffolding that shares it: the ISOs, the source tarballs
          # and the logs would otherwise all be published as "rootfs".
          #
          # Unlike nightly.yml's rootfs export this keeps the empty /dev,
          # /proc, /sys and /run mount points ("dir/*" rather than "dir"),
          # because this archive is extracted and booted again by
          # build-iso-from-cache.yml: busybox switch_root MS_MOVEs those four
          # mounts into the new root and fails when the mount points are
          # absent.
          sudo tar --zstd -cf - -C /tmp/lfs-build/build-release \
            --exclude=./sources --exclude=./logs --exclude=./cache \
            --exclude=./backups --exclude=./live --exclude=./image \
            --exclude=./tools --exclude=./packages --exclude=./lpm-repo \
            --exclude=./sysroot --exclude=./lost+found \
            --exclude=./proc/* --exclude=./sys/* --exclude=./dev/* \
            --exclude=./run/* --exclude=./tmp/* \
            --exclude=./build_info.json --exclude=./sbom.spdx.json \
            --exclude=./*.iso --exclude=./*.iso.sig \
            --exclude=./vmlinuz-* --exclude=./SHA256SUMS-* \
            --exclude=./lfs-installer.iso.pointer \
            . | sudo split -b 1900m -d -a 2 - "/tmp/lfs-build/rootfs-cache-$(date +%Y%m%d).tar.zst.part-"
          cd /tmp/lfs-build || exit 1
          sha256sum rootfs-cache-*.tar.zst.part-* > SHA256SUMS
          ls -lh rootfs-cache-*.tar.zst.part-*

      - name: Generate release body
        id: release_body
        run: |
          cd /tmp/lfs-build || exit 1
          {
            echo 'body<<EOF'
            echo '# 🖥️ LFS Root Filesystem Cache'
            echo ''
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Parts: $(ls rootfs-cache-*.tar.zst.part-* | wc -l)"
            echo "Size: $(du -ch rootfs-cache-*.tar.zst.part-* | tail -n1 | cut -f1)"
            echo ''
            echo 'Contient le noyau et les outils de base.'
            echo ''
            echo 'Reassemble with:'
            echo '```bash'
            echo 'cat $(ls -v rootfs-cache-*.tar.zst.part-*) > rootfs-cache.tar.zst'
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload rootfs cache to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/lfs-build/rootfs-cache-*.tar.zst.part-*
            /tmp/lfs-build/SHA256SUMS
          tag_name: rootfs-cache-latest
          name: LFS Root Filesystem Cache
          body: ${{ steps.release_body.outputs.body }}
          prerelease: true
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "# ✅ Rootfs cache updated" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY