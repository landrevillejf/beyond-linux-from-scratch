name: Build Rootfs Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 15 * *'

permissions:
  contents: write

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            squashfs-tools jq zstd ca-certificates sed \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Download package cache (all parts)
        id: get_packages
        run: |
          RELEASES_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/packages-cache-latest"
          ASSETS=$(curl -fsSL "$RELEASES_URL" | jq -r '
            .assets[]? |
            select(.name | test("^lfs-packages-part-[0-9][0-9]\\.tar\\.gz$")) |
            .browser_download_url
          ' | sort)
          if [ -z "$ASSETS" ]; then
            echo "No package cache parts found. Run the package cache workflow first."
            exit 1
          fi
          echo "asset_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download and combine parts
        run: |
          sudo mkdir -p /tmp/lfs-sources
          cd /tmp
          while IFS= read -r url; do
            echo "Downloading $url"
            wget -q --show-progress -O - "$url" >> packages-combined.tar.gz
          done <<< "${{ steps.get_packages.outputs.asset_urls }}"
          if [ ! -s packages-combined.tar.gz ]; then
            echo "Combined archive is empty."
            exit 1
          fi
          echo "Combined size: $(du -h packages-combined.tar.gz | cut -f1)"

      - name: Extract sources
        run: |
          cd /tmp
          sudo tar -xzf packages-combined.tar.gz -C /tmp/lfs-sources --strip-components=1
          ls -lh /tmp/lfs-sources/ | head -20

      - name: Prepare build directory
        run: |
          sudo rm -rf /tmp/lfs-build
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          # Copier les sources dans le répertoire qui sera monté dans le chroot
          sudo mkdir -p /tmp/lfs-build/sources
          sudo cp -r /tmp/lfs-sources/* /tmp/lfs-build/sources/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Copy host development files into chroot
        run: |
          LFS="/tmp/lfs-build/image"
          sudo mkdir -p "$LFS/usr/include"
          sudo mkdir -p "$LFS/usr/lib/x86_64-linux-gnu"
          sudo mkdir -p "$LFS/usr/lib/gcc/x86_64-linux-gnu"
          
          # Copier les en-têtes système
          sudo cp -r /usr/include/* "$LFS/usr/include/" 2>/dev/null || true
          
          # Copier les bibliothèques partagées et statiques
          sudo cp -r /usr/lib/x86_64-linux-gnu/*.so* "$LFS/usr/lib/x86_64-linux-gnu/" 2>/dev/null || true
          sudo cp -r /usr/lib/x86_64-linux-gnu/*.a "$LFS/usr/lib/x86_64-linux-gnu/" 2>/dev/null || true
          
          # Copier les spécificités GCC
          sudo cp -r /usr/lib/gcc/x86_64-linux-gnu/* "$LFS/usr/lib/gcc/x86_64-linux-gnu/" 2>/dev/null || true
          
          # Créer le lien pour ld-linux
          sudo ln -sf /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 "$LFS/lib64/ld-linux-x86-64.so.2" 2>/dev/null || true
          
          # Mettre à jour ldconfig dans le chroot
          sudo chroot "$LFS" /sbin/ldconfig 2>/dev/null || true

      - name: Build LFS root filesystem (using custom script)
        run: |
          export LFS="/tmp/lfs-build/image"
          export LFS_TGT="$(uname -m)-lfs-linux-gnu"
          export INIT_SYSTEM="sysvinit"
          export KERNEL_TYPE="linux"
          
          # Le script de construction corrigé est déjà présent dans le dépôt (lfs-build-system.sh)
          # On le rend exécutable
          sudo chmod +x /tmp/lfs-build/lfs-build-system.sh
          
          # On l'exécute en root (il gère lui-même sudo et chroot)
          sudo /tmp/lfs-build/lfs-build-system.sh

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-build-logs
          path: /tmp/lfs-build/build-release/logs/

      - name: Verify kernel presence
        run: |
          ls -l /tmp/lfs-build/image/boot/vmlinuz* || { echo "No kernel built"; exit 1; }

      - name: Compress rootfs
        run: |
          sudo tar --zstd -cf rootfs-cache-$(date +%Y%m%d).tar.zst -C /tmp/lfs-build/image .
          ls -lh rootfs-cache-*.tar.zst

      - name: Generate release body
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            echo '# 🖥️ LFS Root Filesystem Cache'
            echo ''
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Size: $(du -sh rootfs-cache-*.tar.zst | cut -f1)"
            echo ''
            echo 'Contient le noyau et les outils de base.'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Upload rootfs cache to release
        uses: softprops/action-gh-release@v2
        with:
          files: rootfs-cache-*.tar.zst
          tag_name: rootfs-cache-latest
          name: LFS Root Filesystem Cache
          body: ${{ steps.release_body.outputs.body }}
          prerelease: true
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "# ✅ Rootfs cache updated" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY