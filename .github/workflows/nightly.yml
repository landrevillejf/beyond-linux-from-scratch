name: Nightly Builds

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier les commits des dernières 24 heures
        id: check
        run: |
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build-profiles:
    needs: check_changes
    if: needs.check_changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        profile: [ minimal, xfce, arm64, server, java-dev, audio-studio, full ]
        init: [ sysvinit ]
        arch: [ x86_64 ]
        include:
          # Cross-compile only for arm64 profile
          - profile: arm64
            arch: aarch64
            init: sysvinit
    permissions:
      contents: write
    env:
      # Empty-string check on a secret is allowed in expressions; the
      # signing step below skips entirely until the repo secrets exist.
      HAVE_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      # ---------- RESTAURATION DU CACHE ----------
      - name: Restore package cache from release
        run: |
          mkdir -p /tmp/artifacts
          cd /tmp/artifacts
          gh release download packages-cache-latest \
            --repo ${{ github.repository }} \
            --pattern "lfs-packages-part-*.tar.gz" \
            --pattern "SHA256SUMS" \
            2>/dev/null || echo "⚠️ No cache release found"
          mkdir -p /tmp/lfs-sources
          if ls lfs-packages-part-*.tar.gz 1>/dev/null 2>&1; then
            cat $(ls -v lfs-packages-part-*.tar.gz) | tar -xz -C /tmp/
            echo "✅ Cache restored successfully"
          else
            echo "⚠️ No cached packages found, will download during build"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check cache status
        id: check_cache
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "✅ Cache HIT: $(find /tmp/lfs-sources -type f | wc -l) files"
          else
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "❌ Cache MISS: Will download packages during build"
          fi

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check LFS compatibility of shell scripts
        run: python3 lfs_check.py --shellcheck

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev squashfs-tools ca-certificates \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: Install ARM64 cross tools
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-static binfmt-support

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Generate sources.list
        run: python3 builder.py --generate-sources-list

      - name: Create lfs user
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      # ---------- TESTS (exécutés AVANT de préparer le build) ----------
      - name: Run tests
        run: python3 -m pytest tests/ -q

      # ---------- PREPARATION DU BUILD ----------
      - name: Prepare lfs build directory
        run: |
          sudo rm -rf /tmp/lfs-build
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a "$GITHUB_WORKSPACE"/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Link cached packages to build directory
        run: |
          if [ -d /tmp/lfs-sources ] && [ $(find /tmp/lfs-sources -type f 2>/dev/null | wc -l) -gt 0 ]; then
            sudo mkdir -p /tmp/lfs-build/build-release/sources
            sudo cp -v /tmp/lfs-sources/* /tmp/lfs-build/build-release/sources/ 2>/dev/null || true
            sudo chown -R lfs:lfs /tmp/lfs-build/build-release
            echo "✅ Linked $(($(find /tmp/lfs-sources -type f | wc -l))) cached packages"
          fi

      - name: Ensure fresh kernel
        run: |
          sudo rm -f /tmp/lfs-build/build-release/sources/linux-*.tar.xz
          echo "🗑️ Removed cached kernel to force fresh download for all architectures"

      # ------- DEBUG (optionnel) -------
      # awk consomme toute l'entree; head fermerait le pipe et ls
      # mourrait en SIGPIPE, ce qui fait echouer l'etape (pipefail).
      - name: Debug sources directory before build
        run: |
          echo "Sources directory:"
          ls -la /tmp/lfs-build/build-release/sources/ | awk 'NR <= 30'
          echo "files in sources : $(find /tmp/lfs-build/build-release/sources/ -maxdepth 1 -type f | wc -l)"

      - name: Ensure build directory is fully owned by lfs user
        run: sudo chown -R lfs:lfs /tmp/lfs-build

      # ------- BUILD -------
      - name: Build release profile ${{ matrix.profile }} / ${{ matrix.init }} / ${{ matrix.arch }}
        run: |
          cd /tmp/lfs-build
          CACHE_STATUS="${{ steps.check_cache.outputs.hit }}"
          echo "📦 Package cache status: $CACHE_STATUS"

          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            PROFILE="arm64"
          else
            PROFILE="${{ matrix.profile }}"
          fi

          sudo -u lfs python3 builder.py \
            --profile "$PROFILE" \
            --init ${{ matrix.init }} \
            --arch ${{ matrix.arch }} \
            --output ./build-release \
            --verbose \
            --nightly \
            --sbom \
            --stage-timeout 18000 \
            --download-timeout 600 \
            --download-retries 5
        env:
          LFS_BUILDER_NONINTERACTIVE: 1

      - name: Resolve ISO name
        id: iso_name
        run: |
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            PROFILE="arm64"
            ARCH="aarch64"
          else
            PROFILE="${{ matrix.profile }}"
            ARCH="${{ matrix.arch }}"
          fi
          BUILDER_VERSION=$(python3 -c "from builder import __version__; print(__version__)")
          DATE=$(date +%Y%m%d)
          ISO_NAME="lfs-${BUILDER_VERSION}-${PROFILE}-${ARCH}-${{ matrix.init }}-${DATE}.iso"
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "📀 ISO name: $ISO_NAME"

      - name: Verify kernel and ISO
        run: |
          SUFFIX="${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}"
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          KERNEL_SRC=$(find /tmp/lfs-build/build-release/image/boot -name "vmlinuz*" | head -n1)
          test -n "$KERNEL_SRC"
          test -s "/tmp/lfs-build/build-release/${ISO}"
          # Give the kernel a per-profile name so release assets from
          # different matrix jobs never collide.
          cp "$KERNEL_SRC" "/tmp/lfs-build/build-release/vmlinuz-${SUFFIX}"
          cd /tmp/lfs-build/build-release || exit 1
          sha256sum "$ISO" "vmlinuz-${SUFFIX}" > "SHA256SUMS-${SUFFIX}"

      - name: Sign ISO with GPG
        if: env.HAVE_GPG_KEY == 'true'
        run: |
          export GNUPGHOME=/tmp/gpg-nightly
          sudo mkdir -p "$GNUPGHOME"
          sudo chown lfs:lfs "$GNUPGHOME"
          sudo chmod 700 "$GNUPGHOME"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | sudo -u lfs env GNUPGHOME="$GNUPGHOME" gpg --batch --import
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          # Passphrase travels through the environment, not the argv.
          sudo -u lfs env GNUPGHOME="$GNUPGHOME" GPG_PASS='${{ secrets.GPG_PASSPHRASE }}' bash -c '
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASS" \
              --local-user "${{ vars.GPG_KEY_ID }}" \
              --detach-sign --armor \
              --output "/tmp/lfs-build/build-release/${0}.sig" \
              "/tmp/lfs-build/build-release/${0}"
          ' "$ISO"
          echo "ISO signed: ${ISO}.sig"
          sudo rm -rf "$GNUPGHOME"

      - name: Create compat ISO pointer
        run: |
          cd /tmp/lfs-build/build-release || exit 1
          ISO="${{ steps.iso_name.outputs.iso_name }}"
          # Release assets cannot be symlinks and copying the ISO would
          # duplicate gigabytes, so publish a tiny pointer that resolves
          # the backward-compatible lfs-installer.iso name.
          SHA=$(sha256sum "$ISO" | awk '{print $1}')
          {
            echo "iso_name=$ISO"
            echo "sha256=$SHA"
            echo "download_url=https://github.com/${{ github.repository }}/releases/download/nightly-$(date +%Y%m%d)/$ISO"
          } > lfs-installer.iso.pointer

      - name: Export split rootfs tarball
        if: matrix.profile == 'xfce' || matrix.profile == 'arm64'
        run: |
          SUFFIX="${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}"
          # Release assets are capped at 2 GB: stream the zstd tarball
          # straight into split parts, same convention as cache-packages.
          sudo bash -c "cd /tmp/lfs-build/build-release && tar --zstd -cf - -C image . | split -b 1900m -d -a 2 - rootfs-${SUFFIX}.tar.zst.part-"
          cd /tmp/lfs-build/build-release || exit 1
          sha256sum rootfs-${SUFFIX}.tar.zst.part-* >> "SHA256SUMS-${SUFFIX}"
          du -h rootfs-${SUFFIX}.tar.zst.part-*

      - name: Rename shared-name artifacts per profile
        run: |
          cd /tmp/lfs-build/build-release || exit 1
          SUFFIX="${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}"
          mv build_info.json "build_info-${SUFFIX}.json"
          if [ -f sbom.spdx.json ]; then
            mv sbom.spdx.json "sbom-${SUFFIX}.spdx.json"
          fi
          if ls lpm-repo/packages.list* >/dev/null 2>&1; then
            for f in lpm-repo/packages.list*; do
              mv "$f" "lpm-repo/$(basename "$f")-${SUFFIX}"
            done
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.profile }}-${{ matrix.init }}-${{ matrix.arch }}
          path: |
            /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/build-release/vmlinuz-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}
            /tmp/lfs-build/build-release/SHA256SUMS-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}
            /tmp/lfs-build/build-release/build_info-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}.json
            /tmp/lfs-build/build-release/sbom-${{ matrix.profile }}-${{ matrix.arch }}-${{ matrix.init }}.spdx.json
            /tmp/lfs-build/build-release/lpm-repo/packages.list*
            /tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}.sig
            /tmp/lfs-build/build-release/lfs-installer.iso.pointer
            /tmp/lfs-build/build-release/rootfs-*.tar.zst.part-*
          if-no-files-found: error

      - name: Boot ISO in QEMU (smoke test)
        if: success() && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          ISO_PATH="/tmp/lfs-build/build-release/${{ steps.iso_name.outputs.iso_name }}"
          echo "Booting $ISO_PATH in QEMU..."
          timeout 90s qemu-system-x86_64 \
            -cdrom "$ISO_PATH" \
            -nographic -no-reboot -m 2G -smp 2 \
            -append "console=ttyS0" | tee qemu.log || true
          if grep -qi "LFS\|init:\|login:" qemu.log; then
            echo "ISO booted successfully!"
          else
            echo "ISO boot failed – no expected output found"
            cat qemu.log
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.profile }}-${{ matrix.init }}-${{ matrix.arch }}
          path: /tmp/lfs-build/build-release/logs/
          if-no-files-found: ignore

  create-release:
    needs: build-profiles
    runs-on: ubuntu-latest
    if: always() && needs.build-profiles.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Compute nightly date
        id: date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Unique dated tag so each nightly gets its own release instead
          # of overwriting a release tagged with the branch name.
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly Build ${{ steps.date.outputs.date }}
          files: artifacts/**/*
          generate_release_notes: true
          # Nightly releases are prereleases: GitHub's "latest" pointer
          # skips them, so `lpm update-db` (releases/latest/download)
          # keeps serving the stable repository manifest.
          prerelease: true
          make_latest: false

      - name: Prune nightly releases older than 30 days
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y%m%d)
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease==true and (.tagName|startswith("nightly-"))) | .tagName' \
            | while read -r tag; do
                day="${tag#nightly-}"
                if [ "$day" -lt "$CUTOFF" ] 2>/dev/null; then
                  echo "Deleting old nightly release: $tag"
                  gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
                fi
              done


