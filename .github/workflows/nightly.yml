name: Nightly Builds

on:
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 3h UTC
  workflow_dispatch:      # déclenchement manuel (toujours permis)

permissions:
  contents: read

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # récupère tout l'historique pour pouvoir faire un git log
      - name: Vérifier les commits des dernières 24 heures
        id: check
        run: |
          # S'il y a au moins un commit dans les 24 dernières heures
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build-profiles:
    needs: check_changes
    # Ne tourne que si :
    #  - workflow déclenché manuellement, OU
    #  - des commits ont été détectés dans les 24h
    if: github.event_name == 'workflow_dispatch' || needs.check_changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, xfce]
        init: [sysvinit, systemd]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Install dependencies (including texinfo for makeinfo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            squashfs-tools ca-certificates

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Create lfs user with passwordless sudo
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Prepare build directory
        run: |
          sudo mkdir -p /tmp/lfs-build /tmp/lfs-output
          sudo cp -a $GITHUB_WORKSPACE/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build /tmp/lfs-output

      - name: Generate sources list
        run: |
          cd /tmp/lfs-build
          python3 builder.py --generate-sources-list

      - name: Cache LFS sources
        uses: actions/cache@v4
        with:
          path: /tmp/lfs-output/sources
          key: nightly-sources-${{ matrix.profile }}-${{ matrix.init }}-${{ hashFiles('packages/sources.list') }}
          restore-keys: |
            nightly-sources-${{ matrix.profile }}-${{ matrix.init }}-
            nightly-sources-

      - name: Run tests
        run: |
          cd /tmp/lfs-build
          python3 -m pytest tests/ -q

      - name: Build ${{ matrix.profile }} / ${{ matrix.init }}
        run: |
          cd /tmp/lfs-build
          sudo -u lfs python3 builder.py --profile "${{ matrix.profile }}" --init "${{ matrix.init }}" --output /tmp/lfs-output

      - name: Verify kernel presence
        run: |
          if ! ls /tmp/lfs-output/image/boot/vmlinuz* >/dev/null 2>&1; then
            echo "Kernel not found in /boot – build failed!"
            ls -la /tmp/lfs-output/image/boot || true
            exit 1
          fi
          echo "Kernel found: $(ls /tmp/lfs-output/image/boot/vmlinuz*)"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: lfs-${{ matrix.profile }}-${{ matrix.init }}-nightly
          path: |
            /tmp/lfs-output/lfs-installer.iso
            /tmp/lfs-output/image/boot/vmlinuz*
            /tmp/lfs-output/build_info.json

      - name: Upload logs on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.profile }}-${{ matrix.init }}
          path: /tmp/lfs-output/logs/