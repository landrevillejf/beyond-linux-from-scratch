name: XFCE SYSVINIT x86_64 Build Cache

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            zstd ca-certificates

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Create lfs user and output directory
        run: |
          sudo useradd -m -s /bin/bash lfs 2>/dev/null || true
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs >/dev/null
          sudo chmod 440 /etc/sudoers.d/lfs
          sudo -u lfs touch /home/lfs/.bashrc
          sudo mkdir -p /tmp/lfs-build
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Generate sources list
        run: python3 builder.py --generate-sources-list

      - name: Cache LFS sources
        uses: actions/cache@v4
        with:
          path: /tmp/lfs-build/sources
          key: lfs-sources-xfce-sysvinit-x86_64-${{ hashFiles('packages/sources.list') }}
          restore-keys: |
            lfs-sources-xfce-sysvinit-x86_64-
            lfs-sources-

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Build cache rootfs (no live ISO)
        run: |
          sudo -u lfs python3 builder.py \
            --profile xfce \
            --init sysvinit \
            --no-live \
            --output /tmp/lfs-build

      - name: Verify kernel in cache
        run: |
          ls -l /tmp/lfs-build/image/boot
          ls /tmp/lfs-build/image/boot/vmlinuz*

      - name: Create cache archive
        run: |
          cd /tmp/lfs-build/image
          sudo tar --zstd -cf /tmp/rootfs-cache-xfce-sysvinit-x86_64.tar.zst \
            --exclude='proc' --exclude='sys' --exclude='dev' --exclude='run' --exclude='sources' .
          sudo chown "$USER:$USER" /tmp/rootfs-cache-xfce-sysvinit-x86_64.tar.zst
          ls -lh /tmp/rootfs-cache-xfce-sysvinit-x86_64.tar.zst

      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-cache-xfce-sysvinit-x86_64
          path: /tmp/rootfs-cache-xfce-sysvinit-x86_64.tar.zst
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-xfce-sysvinit-x86_64
          path: /tmp/lfs-build/logs/