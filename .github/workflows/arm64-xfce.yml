name: ARM64 XFCE Build

on:
  schedule:
    - cron: '0 3 * * *'   # 3am daily
  workflow_dispatch:   # <-- permet de lancer manuellement

permissions:
  contents: read

jobs:
  arm64:
    # Native ARM, not x86_64 plus qemu-user.  Emulated, this build cannot
    # finish at any stage timeout: lfs-system measured 4h20m for the 14
    # packages x86_64 builds in under an hour (~27x slower per package),
    # projecting past 11h against GitHub's hard 6h per-job cap.  ARM64 XFCE
    # #41 was killed at 2h by the stage timeout and nightly #221's aarch64
    # job at 5h30m by the workflow one, neither having finished lfs-system.
    # ubuntu-24.04-arm is the ARM counterpart of ubuntu-latest and is free
    # for public repositories, so the same profile builds natively at
    # x86_64-comparable speed (x86_64 lfs-system: 59m33s for 86 packages).
    runs-on: ubuntu-24.04-arm
    # 5h30m yields a clean cancelled() ahead of the 6h hard cap, which kills
    # the job leaving no diagnostics; nightly.yml already uses this value.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          # squashfs-tools, grub-efi-arm64-bin and busybox-static are what
          # final/12 and final/14 need now that the installer stage runs on
          # aarch64 too: /usr/lib/grub/arm64-efi/ comes only from
          # grub-efi-arm64-bin, and busybox.net publishes static binaries for
          # i686 and x86_64 only, so there is nothing for final/12 to download
          # on an ARM runner.
          sudo apt install -y build-essential bison flex gawk texinfo \
            wget curl git python3 python3-pip xorriso isolinux \
            mtools dosfstools parted rsync bc cpio kmod \
            libssl-dev libelf-dev squashfs-tools \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            grub-efi-arm64-bin busybox-static

      - name: Create lfs user
        run: |
          if ! id lfs &>/dev/null; then
            sudo useradd -m -s /bin/bash lfs
          fi
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Grant lfs user passwordless sudo
        run: |
          echo "lfs ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lfs

      - name: Prepare lfs build directory
        run: |
          sudo mkdir -p /tmp/lfs-build
          sudo cp -a $GITHUB_WORKSPACE/. /tmp/lfs-build/
          sudo chown -R lfs:lfs /tmp/lfs-build

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Build ARM64
        run: |
          cd /tmp/lfs-build
          # No --stage-timeout override any more: natively, lfs-system takes
          # about an hour, so the 7200s default is ample and a genuinely
          # stuck stage still reports itself promptly rather than after 3h.
          #
          # gcc-aarch64-linux-gnu stays - host/05-build-uboot.sh hard-requires
          # ${CROSS_COMPILE}gcc, and on an arm64 runner that package is the
          # native compiler under its triplet name, so host/04 derives
          # LFS_TGT from `uname -m` and builds natively.
          #
          # qemu-user-static is deliberately gone: host/00-setup-qemu.sh now
          # skips when `uname -m` matches the target, so keeping an emulator
          # installed would only offer a way to regress into a 27x slower
          # build, and its absence makes such a regression fail loudly.
          sudo -u lfs python3 builder.py --profile arm64 --no-live \
            --output ./build-arm64 \
            --download-timeout 600 \
            --download-retries 5

      - name: Resolve ISO name
        id: iso_name
        run: |
          # Mirrors builder.py's get_iso_name(): lfs-{version}-{profile}-
          # {arch}-{init}.iso, with no --milestone and no --nightly here, so
          # no date component.  Guessing lfs-installer.iso instead would only
          # ever find the backward-compatibility symlink build() leaves
          # behind, which upload-artifact is not required to follow.
          BUILDER_VERSION=$(python3 -c "from builder import __version__; print(__version__)")
          ISO_NAME="lfs-${BUILDER_VERSION}-arm64-aarch64-sysvinit.iso"
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "ISO name: $ISO_NAME"

      - name: Verify output image
        run: |
          # builder.py exports LFS as its --output directory, so the rootfs
          # IS build-arm64/: the kernel is in build-arm64/boot and final/14
          # writes the UEFI ISO there too.  The old
          # build-arm64/image/boot/vmlinuz* belonged to a two-level layout
          # that no longer exists, image/ being created empty and populated
          # by nothing, and host/03 puts the disk image one level up, beside
          # the output directory, not inside it.
          ISO="/tmp/lfs-build/build-arm64/${{ steps.iso_name.outputs.iso_name }}"
          IMG=/tmp/lfs-build/build-arm64.img
          if [ -s "$ISO" ]; then
            echo "Found $(basename "$ISO")"
          elif [ -s "$IMG" ]; then
            echo "Found build-arm64.img"
          else
            echo "No ISO or disk image found" >&2
            exit 1
          fi
          ls /tmp/lfs-build/build-arm64/boot/vmlinuz*

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-cross-build
          path: |
            /tmp/lfs-build/build-arm64/${{ steps.iso_name.outputs.iso_name }}
            /tmp/lfs-build/build-arm64/boot/vmlinuz*
            /tmp/lfs-build/build-arm64/build_info.json
          if-no-files-found: warn