name: Build ISO from Cache

on:
  workflow_dispatch:
    inputs:
      cache_url:
        description: "Optional direct URL to rootfs cache archive (.tar.zst or .tar.xz)"
        required: false
        type: string
      create_release:
        description: "Create a GitHub release with ISO + kernel"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk texinfo wget git python3 python3-pip \
            xorriso isolinux mtools dosfstools parted rsync bc cpio libssl-dev libelf-dev \
            squashfs-tools jq zstd ca-certificates sed

      - name: Create lfs user (if needed)
        run: |
          if ! id "lfs" &>/dev/null; then
            sudo useradd -m -s /bin/bash lfs
          fi
          sudo -u lfs touch /home/lfs/.bashrc

      - name: Resolve cache URL
        id: get_cache
        run: |
          if [ -n "${{ github.event.inputs.cache_url }}" ]; then
            echo "single_url=${{ github.event.inputs.cache_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The rootfs cache release ships split parts (2 GB asset cap);
          # collect every part sorted by name for reassembly.
          RELEASES_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/rootfs-cache-latest"
          ASSETS=$(curl -fsSL "$RELEASES_URL" | jq -r '
            .assets[]? |
            select(.name | test("^rootfs-cache-.*\\.tar\\.zst\\.part-[0-9][0-9]$")) |
            .browser_download_url
          ' | sort)
          if [ -z "$ASSETS" ]; then
            echo "No rootfs cache parts found in releases"
            exit 1
          fi
          echo "part_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download and extract cache
        run: |
          sudo mkdir -p /tmp/lfs-build/image
          cd /tmp/lfs-build || exit 1
          if [ -n "${{ steps.get_cache.outputs.single_url }}" ]; then
            sudo wget -q --show-progress "${{ steps.get_cache.outputs.single_url }}" -O rootfs-cache.tar
          else
            # Reassemble the split parts in name order before extracting.
            while IFS= read -r url; do
              echo "Downloading $url"
              wget -q --show-progress -O - "$url" >> rootfs-cache.tar
            done <<< "${{ steps.get_cache.outputs.part_urls }}"
          fi
          if [ ! -s rootfs-cache.tar ]; then
            echo "Combined rootfs cache archive is empty."
            exit 1
          fi
          if file rootfs-cache.tar | grep -qi zstd; then
            sudo tar --zstd -xf rootfs-cache.tar -C image/
          else
            sudo tar -xf rootfs-cache.tar -C image/
          fi
          sudo chown -R lfs:lfs image/ || true
          ls -lh image/
          
      - name: Validate cache content
        run: |
          if ! ls /tmp/lfs-build/image/boot/vmlinuz* >/dev/null 2>&1; then
            echo "Cache does not contain a kernel – cannot build ISO."
            echo "Contents of /tmp/lfs-build/image/boot:"
            ls -la /tmp/lfs-build/image/boot || true
            exit 1
          fi
          echo "Cache appears valid"

      - name: Copy repository to /tmp/lfs-builder
        run: |
          sudo mkdir -p /tmp/lfs-builder
          sudo cp -a . /tmp/lfs-builder/
          sudo chmod +x /tmp/lfs-builder/final/*.sh
          sudo chown -R lfs:lfs /tmp/lfs-builder

      - name: Resolve ISO name
        id: release_info
        run: |
          BUILDER_VERSION=$(python3 -c "from builder import __version__; print(__version__)")
          TAG="v${BUILDER_VERSION}-iso-from-cache-$(date +%Y%m%d-%H%M%S)"
          ISO_NAME="lfs-${BUILDER_VERSION}-xfce-x86_64-sysvinit-$(date +%Y%m%d).iso"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=LFS ISO from cache v${BUILDER_VERSION} $(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT

      - name: Run final stages for ISO generation
        id: build_iso
        run: |
          LFS_PATH="/tmp/lfs-build/image"
          cd /tmp/lfs-builder
          sudo LFS="$LFS_PATH" ISO_NAME="${{ steps.release_info.outputs.iso_name }}" ./final/12-create-initramfs.sh
          sudo LFS="$LFS_PATH" ISO_NAME="${{ steps.release_info.outputs.iso_name }}" ./final/13-create-bootloader.sh
          sudo LFS="$LFS_PATH" ISO_NAME="${{ steps.release_info.outputs.iso_name }}" ./final/14-create-installer.sh
          sudo LFS="$LFS_PATH" ISO_NAME="${{ steps.release_info.outputs.iso_name }}" ./final/15-create-live-system.sh

      - name: Verify kernel and ISO
        run: |
          ls /tmp/lfs-build/image/boot/vmlinuz*
          test -s /tmp/lfs-build/${{ steps.release_info.outputs.iso_name }}
          sha256sum /tmp/lfs-build/${{ steps.release_info.outputs.iso_name }} > /tmp/lfs-build/SHA256SUMS
          sha256sum /tmp/lfs-build/image/boot/vmlinuz* >> /tmp/lfs-build/SHA256SUMS

      - name: Boot ISO in QEMU (smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          bash tools/qemu-boot-smoke.sh "/tmp/lfs-build/${{ steps.release_info.outputs.iso_name }}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-from-cache
          path: |
            /tmp/lfs-build/${{ steps.release_info.outputs.iso_name }}
            /tmp/lfs-build/image/boot/vmlinuz*
            /tmp/lfs-build/SHA256SUMS
          if-no-files-found: error

      - name: Upload ISO to release
        if: github.event_name == 'schedule' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          files: |
            /tmp/lfs-build/${{ steps.release_info.outputs.iso_name }}
            /tmp/lfs-build/image/boot/vmlinuz*
            /tmp/lfs-build/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify ISO presence
        if: always()
        run: |
          if [ -f "/tmp/lfs-build/${{ steps.release_info.outputs.iso_name }}" ]; then
            echo "ISO built successfully"
          else
            echo "ISO not found"
            exit 1
          fi